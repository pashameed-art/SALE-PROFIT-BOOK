<!DOCTYPE html>
<html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><link rel="manifest" href="./manifest.json"><title>Sale Profit Book V9</title>
<style>
:root{--g:#0f766e;--bg:#eef3f3;--c:#fff;--t:#17202a;--m:#64748b;--r:#c62828;--ok:#16834b;--ln:#e3ebeb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Noto Sans Tamil",sans-serif;background:var(--bg);color:var(--t);padding-bottom:88px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#0f766e,#14a398);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 14px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 20px 20px;box-shadow:0 4px 14px #0f766e44}
header b{font-size:18px;letter-spacing:.2px}header small{color:#d3f5f0;font-size:12px}
.ver{background:#ffffff33;border-radius:10px;padding:3px 10px;font-size:12px;font-weight:700}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--c);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0f766e14;border:1px solid var(--ln)}
.card>b:first-child{display:block;font-size:16px;margin-bottom:2px}
.card.red{border-color:#f3c4c4;background:#fff7f7}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px;color:var(--m)}
input,select{width:100%;padding:11px 12px;border:1.5px solid #d5e0e0;border-radius:10px;font-size:15px;background:#fff;color:var(--t);outline:none}
input:focus,select:focus{border-color:var(--g);box-shadow:0 0 0 3px #0f766e22}
button{background:linear-gradient(135deg,#0f766e,#14a398);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:700;margin-top:10px;box-shadow:0 2px 6px #0f766e33;transition:transform .08s}
button:active{transform:scale(.96)}
button.s{background:#e3f1ef;color:var(--g);box-shadow:none}
button.d{background:#fdeaea;color:var(--r);padding:5px 10px;margin:0;font-size:12px;box-shadow:none;border-radius:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);box-shadow:0 -4px 16px #0000000d;z-index:6}
nav button{flex:1;min-width:0;white-space:nowrap;background:none;box-shadow:none;color:var(--m);border-radius:12px;margin:0 1px;padding:6px 0;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:19px;line-height:1}
nav button.on{background:#e3f1ef;color:var(--g)}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--ln);align-items:center}
.row:first-child{border-top:0}
small{color:var(--m);display:block;font-size:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:linear-gradient(135deg,#f3fbfa,#e5f3f1);border-radius:12px;padding:10px 12px;border:1px solid #d6ebe8;font-size:12px;color:var(--m)}
.k b{display:block;font-size:18px;margin-top:2px}
.k b:not(.red):not(.grn){color:var(--t)}
.red{color:var(--r)}.grn{color:var(--ok)}.hide{display:none}
</style></head><body>
<header><div><b>🧵 Sale Profit Book</b><br><small id="hd"></small></div><span class="ver">V9.15</span></header>
<main id="app"></main>
<div id="lgW" style="display:none;padding:12px;max-width:640px;margin:auto">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:15px">📗 Mass Sales Ledger</b><a href="https://pashameed-art.github.io/mass-sales-ledger/" target="_blank" rel="noopener" style="color:var(--g);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap">புதிய tab ↗</a></div>
<div id="cmpBox"></div>
<iframe id="lgF" title="Mass Sales Ledger" style="width:100%;height:calc(100vh - 190px);min-height:420px;border:1px solid var(--ln);border-radius:12px;background:#fff"></iframe></div>
<nav id="nav"></nav>
<script>
'use strict';
const KEY={items:'spb_v4_items',entries:'spb_v4_entries',exp:'spb_v4_expenses',stock:'spb_v4_stock',pay:'spb_credit_payments_v1',cus:'spb_credit_customers_v1'};
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>{v=Number(v);return isFinite(v)?v:0};
const M=n=>(N(n)<0?'−':'')+'₹'+Math.abs(N(n)).toLocaleString('en-IN',{maximumFractionDigits:2});
const rd=k=>{try{const a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}};
const wr=(k,a)=>localStorage.setItem(k,JSON.stringify(a));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const VER='9.15';
const lastPlace=()=>localStorage.getItem('spb_v9_place')||'Kadayanallur';
const places=()=>[...new Set(rd(KEY.entries).map(x=>String(x.place||'').trim()).filter(Boolean))];
const nm=s=>String(s||'').replace(/\s+/g,' ').trim();
const fd=v=>{const p=String(v||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v};
let tab='home',cbKey=null,from='',to='',pw='Mansoor',pEdit=null,editId=null,mixOpen=false,mx=[];
const TABS=[['home','🏠 Home'],['hist','📜 History'],['stock','📦 Stock'],['exp','💸 Expense'],['credit','📒 Credit'],['party','🤝 Party'],['ledger','📗 Ledger'],['bak','☁️ Backup']];

function stockOf(item){
  const mv=rd(KEY.stock).filter(x=>x.item===item);
  const inn=mv.filter(x=>String(x.type||'Stock In')!=='Stock Out').reduce((a,x)=>a+N(x.meter),0);
  const out=mv.filter(x=>x.type==='Stock Out').reduce((a,x)=>a+N(x.meter),0);
  const sold=rd(KEY.entries).filter(x=>x.item===item).reduce((a,x)=>a+N(x.meter),0);
  return Math.round((inn-out-sold)*100)/100;
}
function ledger(){
  const m={};const g=n=>{const k=nm(n).toLowerCase();return m[k]||(m[k]={name:nm(n),sale:0,paid:0,last:''})};
  rd(KEY.entries).forEach(x=>{if(x.paidBy!=='Credit')return;const c=g(x.customer||'(பெயர் இல்லை)');c.sale+=N(x.sale);if(String(x.date)>=c.last)c.last=String(x.date)});
  rd(KEY.pay).forEach(p=>{if(nm(p.customer))g(p.customer).paid+=N(p.amount)});
  return Object.values(m).map(c=>({...c,due:Math.round((c.sale-c.paid)*100)/100}));
}
function names(){return ledger().map(c=>c.name).sort()}

/* ---------- HOME ---------- */
function vHome(){
  const t=today(),en=rd(KEY.entries).filter(x=>x.date===t),ex=rd(KEY.exp).filter(x=>x.date===t);
  const s=en.reduce((a,x)=>a+N(x.sale),0),p=en.reduce((a,x)=>a+N(x.profit),0),e=ex.reduce((a,x)=>a+N(x.amount),0),mt=en.reduce((a,x)=>a+N(x.meter),0);
  const it=rd(KEY.items).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const low=it.filter(i=>i.min>0&&stockOf(i.name)<=i.min);
  const ed=editId?rd(KEY.entries).find(x=>N(x.id)===editId):null;
  return `  <div class="card"><b>${ed?'✏️ Entry Edit':'📝 New Entry'}</b>
  <label>Date</label><input type="date" id="eDate" value="${ed?ed.date:t}">
  <label>Place</label><input id="ePlace" list="plL" autocomplete="off" value="${E(ed?ed.place||'':lastPlace())}"><datalist id="plL">${places().map(n=>`<option value="${E(n)}">`).join('')}</datalist>
  <label>Item</label><select id="eItem" onchange="calc()"><option value="">Select Item</option>${it.map(i=>`<option value="${E(i.name)}"${ed&&ed.item===i.name?' selected':''}>${E(i.name)}</option>`).join('')}</select>
  <small id="eStock"></small>
  <div class="g"><div><label>Meter</label><input id="eMeter" type="number" inputmode="decimal" step="0.01" oninput="calc()" value="${ed?ed.meter:''}"></div>
  <div><label>Sale ₹</label><input id="eSale" type="number" inputmode="decimal" oninput="calc()" value="${ed?ed.sale:''}"></div></div>
  <label>Paid By</label><select id="ePay" onchange="$('cbox').classList.toggle('hide',this.value!=='Credit')"><option${ed&&ed.paidBy==='GPay'?' selected':''}>GPay</option><option${ed&&ed.paidBy==='Cash'?' selected':''}>Cash</option><option value="Credit"${ed&&ed.paidBy==='Credit'?' selected':''}>Credit (கடன்)</option></select>
  <div id="cbox" class="${ed&&ed.paidBy==='Credit'?'':'hide'}"><label>Customer பெயர்</label><input id="eCus" list="cl" autocomplete="off" value="${E(ed&&ed.customer||'')}"><datalist id="cl">${names().map(n=>`<option value="${E(n)}">`).join('')}</datalist></div>
  <small id="eCalc"></small><button onclick="saveEntry()">${ed?'Update Entry':'Save Entry'}</button>${ed?'<button class="s" onclick="editId=null;render()">Cancel</button>':''}</div>
  ${ed?'':mixHtml(it)}
  ${ed?'':dashHtml(low)}`;
}
function calc(){
  const it=rd(KEY.items).find(i=>i.name===$('eItem').value),m=N($('eMeter').value),s=N($('eSale').value);
  $('eStock').textContent=it?'Stock: '+stockOf(it.name)+' m • Rate ₹'+it.rate:'';
  $('eCalc').textContent=it&&m?`Purchase ${M(it.rate*m)} • Profit ${M(s-it.rate*m)}`:'';
}
function saveEntry(){
  const item=$('eItem').value,meter=N($('eMeter').value),sale=N($('eSale').value),paid=$('ePay').value,cus=nm($('eCus')&&$('eCus').value);
  const it=rd(KEY.items).find(i=>i.name===item);
  if(!it)return alert('Item தேர்ந்தெடுக்கவும்.');
  if(!(meter>0))return alert('Meter உள்ளிடவும்.');
  if(!(sale>=0)||$('eSale').value==='')return alert('Sale தொகை உள்ளிடவும்.');
  if(paid==='Credit'&&!cus)return alert('Credit-க்கு Customer பெயர் தேவை.');
  const a=rd(KEY.entries),old=editId?a.find(x=>N(x.id)===editId):null;
  const st=stockOf(item)+(old&&old.item===item?N(old.meter):0);
  if(meter>st&&!confirm(`Stock ${st} m மட்டுமே உள்ளது. ${meter} m விற்கவா? (Stock minus ஆகும்)`))return;
  const rate=old&&old.item===item?N(old.rate)||it.rate:it.rate,purchase=rate*meter;
  const place=nm($('ePlace').value)||'Kadayanallur';localStorage.setItem('spb_v9_place',place);
  const b={date:$('eDate').value||today(),place,item,meter,rate,sale,paidBy:paid,purchase,profit:sale-purchase};
  if(old){const n={...old,...b};if(paid==='Credit')n.customer=cus;else delete n.customer;a[a.indexOf(old)]=n;editId=null}
  else{const n={id:Date.now(),...b,time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})};if(paid==='Credit')n.customer=cus;a.unshift(n)}
  wr(KEY.entries,a);render();
}
function editEntry(id){editId=id;mixOpen=false;tab='home';render();scrollTo(0,0)}

/* ---------- MIXED SALE ---------- */
function mixHtml(it){
  if(!mixOpen)return `<div class="card"><button class="s" style="margin:0;width:100%" onclick="mixOpen=true;mx=[{},{}];render()">➕ Multiple Items / Mixed Sale</button></div>`;
  return `<div class="card"><b>🧾 Mixed Sale</b><small>ஒவ்வொரு Item-ன் Meter மற்றும் Sale Share உள்ளிடவும்.</small>
  <label>Date</label><input type="date" id="mDt" value="${today()}">
  <label>Place</label><input id="mPl" list="plL" autocomplete="off" value="${E(lastPlace())}">
  ${mx.map((r,i)=>`<div style="border-top:1px solid #eee;margin-top:8px;padding-top:6px"><select id="mxI${i}" onchange="mxTot()"><option value="">Select Item</option>${it.map(x=>`<option value="${E(x.name)}"${r.item===x.name?' selected':''}>${E(x.name)} (${stockOf(x.name)} m)</option>`).join('')}</select>
  <div class="g"><input id="mxM${i}" type="number" inputmode="decimal" step="0.01" placeholder="Meter" value="${E(r.meter||'')}" oninput="mxTot()"><input id="mxS${i}" type="number" inputmode="decimal" placeholder="Sale ₹" value="${E(r.sale||'')}" oninput="mxTot()"></div>
  ${mx.length>1?`<button class="d" onclick="mxDel(${i})">✕ நீக்கு</button>`:''}</div>`).join('')}
  <button class="s" onclick="mxSync();mx.push({});render()">➕ Add Another Item</button>
  <label>Paid By</label><select id="mPay" onchange="$('mbox').classList.toggle('hide',this.value!=='Credit')"><option>GPay</option><option>Cash</option><option value="Credit">Credit (கடன்)</option></select>
  <div id="mbox" class="hide"><label>Customer பெயர்</label><input id="mCus" list="cl" autocomplete="off"></div>
  <small id="mxT" style="margin-top:8px"></small>
  <button onclick="saveMixed()">Save Mixed Sale</button> <button class="s" onclick="mixOpen=false;render()">Close</button></div>`;
}
function mxSync(){mx=mx.map((_,i)=>({item:$('mxI'+i).value,meter:$('mxM'+i).value,sale:$('mxS'+i).value}))}
function mxDel(i){mxSync();mx.splice(i,1);render()}
function mxTot(){
  const its=rd(KEY.items);let s=0,p=0;
  mx.forEach((_,i)=>{const it=its.find(x=>x.name===$('mxI'+i).value),m=N($('mxM'+i).value);s+=N($('mxS'+i).value);if(it)p+=it.rate*m});
  $('mxT').textContent=`Total Sale: ${M(s)} • Purchase: ${M(p)} • Profit: ${M(s-p)}`;
}
function saveMixed(){
  mxSync();const its=rd(KEY.items),paid=$('mPay').value,cus=nm($('mCus').value);
  const rows=mx.filter(r=>r.item||N(r.meter)||N(r.sale));
  if(!rows.length)return alert('குறைந்தது ஒரு Item சேர்க்கவும்.');
  for(const r of rows){if(!its.find(x=>x.name===r.item)||!(N(r.meter)>0)||r.sale===''||N(r.sale)<0)return alert('ஒவ்வொரு வரிக்கும் Item, Meter, Sale உள்ளிடவும்.')}
  if(paid==='Credit'&&!cus)return alert('Credit-க்கு Customer பெயர் தேவை.');
  const need={};rows.forEach(r=>need[r.item]=(need[r.item]||0)+N(r.meter));
  const short=Object.keys(need).filter(k=>need[k]>stockOf(k));
  if(short.length&&!confirm('Stock போதாது: '+short.map(k=>k+' ('+stockOf(k)+' m)').join(', ')+'. தொடரவா? (Stock minus ஆகும்)'))return;
  const place=nm($('mPl').value)||'Kadayanallur';localStorage.setItem('spb_v9_place',place);
  const a=rd(KEY.entries),now=Date.now(),date=$('mDt').value||today(),gid='MS'+now,time=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
  rows.forEach((r,i)=>{const it=its.find(x=>x.name===r.item),m=N(r.meter),s=N(r.sale),pu=it.rate*m;
    const n={id:now+i,date,place,item:r.item,meter:m,rate:it.rate,sale:s,paidBy:paid,purchase:pu,profit:s-pu,time,mixedGroup:gid};
    if(paid==='Credit')n.customer=cus;a.unshift(n)});
  wr(KEY.entries,a);mixOpen=false;mx=[];render();
}

/* ---------- HISTORY + REPORT ---------- */
function vHist(){
  const q=hq.trim().toLowerCase(),hm=x=>!q||[x.item,x.customer,x.place,x.paidBy,x.date,fd(x.date)].some(v=>String(v||'').toLowerCase().includes(q));
  let a=rd(KEY.entries).filter(x=>(!from||x.date>=from)&&(!to||x.date<=to)&&hm(x)).sort((x,y)=>String(y.date).localeCompare(String(x.date))||N(y.id)-N(x.id));
  const s=a.reduce((t,x)=>t+N(x.sale),0),p=a.reduce((t,x)=>t+N(x.profit),0),pu=a.reduce((t,x)=>t+N(x.purchase),0),m=a.reduce((t,x)=>t+N(x.meter),0);
  const ex=rd(KEY.exp).filter(inR).reduce((t,x)=>t+N(x.amount),0);
  return `<div class="card"><div class="g"><div><label>From</label><input type="date" id="hF" value="${from}" onchange="from=this.value;render()"></div><div><label>To</label><input type="date" id="hT" value="${to}" onchange="to=this.value;render()"></div></div>
  <label>🔍 தேடல்</label><input id="hQ" placeholder="Item / Customer / Place / Cash / GPay" value="${E(hq)}" oninput="hq=this.value;_hf=1;render()">
  <div class="g" style="margin-top:8px"><div class="k">Sale<b>${M(s)}</b></div><div class="k">Profit<b>${M(p)}</b></div><div class="k">Purchase<b>${M(pu)}</b></div><div class="k">Meter<b>${m}</b></div>${q?'':`<div class="k">Expense<b>${M(ex)}</b></div><div class="k" style="grid-column:1/-1">Net Profit<b class="${p-ex<0?'red':'grn'}">${M(p-ex)}</b></div>`}</div>${q?`<small style="margin-top:6px">"${E(hq)}" தேடல் முடிவுகள்: ${a.length} பதிவுகள். Expense / Net Profit தேடலில் காட்டப்படாது; CSV / WhatsApp / PDF தேதி வரம்புக்கானவை.</small>`:''}
  <button class="s" onclick="csv()">⬇️ CSV</button> <button class="s" onclick="repShare()">📤 WhatsApp</button> <button class="s" onclick="repPdf()">🖨️ PDF</button> <button class="s" onclick="from=to=today();render()">Today</button> <button class="s" onclick="from=to='';render()">All</button></div>
  <div class="card"><div onclick="hlToggle()" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer"><b>📜 பதிவுகள் (${a.length})</b><span id="hlArr" style="color:var(--g);font-weight:700;font-size:13px">${hlOpen||q?'▲ மூடு':'▼ பார்க்க'}</span></div>
  <div id="hlBody" class="${hlOpen||q?'':'hide'}">${a.slice(0,200).map(x=>`<div class="row"><div><b>${E(x.item)}</b> • ${N(x.meter)} m<small>${fd(x.date)}${x.place?' • 📍'+E(x.place):''} • ${E(x.paidBy)}${x.customer?' • '+E(x.customer):''}</small></div><div style="text-align:right">${M(x.sale)}<small>${M(x.profit)}</small><button class="d" style="background:#e3eceb;color:#0f766e" onclick="editEntry(${N(x.id)})">✏️</button> <button class="d" onclick="delEntry(${N(x.id)})">Delete</button></div></div>`).join('')||'<small>பதிவுகள் இல்லை</small>'}</div></div>
  ${q?'':monthCard()}`;
}
const MN=['ஜனவரி','பிப்ரவரி','மார்ச்','ஏப்ரல்','மே','ஜூன்','ஜூலை','ஆகஸ்ட்','செப்டம்பர்','அக்டோபர்','நவம்பர்','டிசம்பர்'];
function monthCard(){
  const m={},g=k=>m[k]||(m[k]={s:0,p:0,mt:0,e:0});
  rd(KEY.entries).forEach(x=>{const k=String(x.date).slice(0,7);if(k.length!==7)return;const o=g(k);o.s+=N(x.sale);o.p+=N(x.profit);o.mt+=N(x.meter)});
  rd(KEY.exp).forEach(x=>{const k=String(x.date).slice(0,7);if(k.length!==7)return;g(k).e+=N(x.amount)});
  const ks=Object.keys(m).sort().reverse().slice(0,12);
  return `<div class="card"><b>📅 மாத வாரியாக</b><small>மாதத்தைத் தட்டினால் அந்த மாதப் பதிவுகள் மேலே வரும்</small>${ks.map(k=>{const o=m[k],n=o.p-o.e,y=k.slice(0,4),mo=+k.slice(5,7),last=new Date(+y,mo,0).getDate();
    return `<div class="row" onclick="from='${k}-01';to='${k}-${String(last).padStart(2,'0')}';render();scrollTo(0,0)"><div><b>${MN[mo-1]||k} ${y}</b><small>Sale ${M(o.s)} • ${Math.round(o.mt*100)/100} m</small><small>Profit ${M(o.p)} • Expense ${M(o.e)}</small></div><div style="text-align:right"><b class="${n<0?'red':'grn'}">${M(n)}</b><small>Net Profit</small></div></div>`}).join('')||'<small>பதிவுகள் இல்லை</small>'}</div>`;
}
function delEntry(id){if(!confirm('இந்த Entry-ஐ delete செய்யவா?'))return;wr(KEY.entries,rd(KEY.entries).filter(x=>N(x.id)!==id));render()}
function csv(){
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const a=rd(KEY.entries).filter(x=>(!from||x.date>=from)&&(!to||x.date<=to));

const GCID='123737120474-8sqc1sb4p0i9j7s9nq56j4gkd784lm1n.apps.googleusercontent.com',GPRE='SALE-PROFIT-BOOK-Backup-',GKEEP=10;

function gLoad(){return new Promise((ok,no)=>{

async function gToken(){

  return new Promise((ok,no)=>{
    const cb=r=>{if(r&&r.access_token){gTok=r.access_token;gExp=Date.now()+Math.max(60,(Number(r.expires_in)||3600)-120)*1000;ok(gTok)}else no(new Error('Google authorization முடியவில்லை'))};
    try{if(!gCli)gCli=google.accounts.oauth2.initTokenClient({client_id:GCID,scope:'https://www.googleapis.com/auth/drive.file',callback:cb});else gCli.callback=cb;gCli.requestAccessToken({prompt:''})}catch(e){no(e)}
  });

async function gList(tok){

  <button id="ib" class="${ip?'':'hide'}" style="width:100%" onclick="inst()">📲 Install App</button>`;

  if(!n)return alert('Delete செய்ய '+lbl+' data இல்லை.');
  if(!confirm('Delete ALL '+lbl+' data?\n\n'+n+' பதிவுகள் நிரந்தரமாக நீக்கப்படும்.'))return;
  if(!confirm('இறுதி உறுதி: எல்லா '+lbl+' data-வையும் Delete செய்யவா?\n\n(முன்னதாக தானாகவே backup file download ஆகும்.)'))return;
  dl('SALE-PROFIT-BOOK-BEFORE-DELETE-'+today()+'.json',JSON.stringify(snap(),null,1),'application/json');
  wr(k,[]);
  if(kind==='sales'&&rd(KEY.pay).length&&confirm('Credit payments-ஐயும் Delete செய்யவா?\n\n(இல்லையென்றால் customers "advance" ஆகத் தெரிவார்கள்.)'))wr(KEY.pay,[]);
  alert('✅ '+lbl+' data Delete செய்யப்பட்டது.');render();

async function appRefresh(){
  try{const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}
  location.reload();
}


/* ---------- DAY-END REPORT ---------- */
function dayData(d){
  const lc=s=>String(s||'').toLowerCase(),a=rd(KEY.entries).filter(x=>x.date===d),ex=rd(KEY.exp).filter(x=>x.date===d),py=rd(KEY.pay).filter(x=>x.date===d);
  const S=(arr,k)=>arr.reduce((t,x)=>t+N(x[k]),0),by=m=>S(a.filter(x=>lc(x.paidBy)===m),'sale'),pm=m=>S(py.filter(x=>lc(x.mode)===m),'amount');
  const sale=S(a,'sale'),cashS=by('cash'),gpayS=by('gpay'),credS=by('credit'),cashP=pm('cash'),gpayP=pm('gpay'),expense=S(ex,'amount'),exG=S(ex.filter(x=>lc(x.paidBy)==='gpay'),'amount'),exC=expense-exG,profit=S(a,'profit');
  const eg={};ex.forEach(x=>{const n=nm(x.name)||'(பெயர் இல்லை)';eg[n]=(eg[n]||0)+N(x.amount)});
  return {n:a.length,meter:Math.round(S(a,'meter')*100)/100,sale,cashS,gpayS,credS,otherS:sale-cashS-gpayS-credS,cashP,gpayP,otherP:S(py,'amount')-cashP-gpayP,purchase:S(a,'purchase'),profit,expense,eg,
    cash:cashS+cashP,gpay:gpayS+gpayP,net:profit-expense,exC,exG,hand:cashS+cashP-exC};
}
function deBox(){
  const d=dayData(deD),rw=(l,v,c)=>`<div class="row"><span>${l}</span><b class="${c||''}">${M(v)}</b></div>`,sec=h=>`<b style="font-size:14px;display:block;margin-top:10px">${h}</b>`;
  const egl=Object.keys(d.eg).sort((x,y)=>d.eg[y]-d.eg[x]).map(n=>E(n)+' '+M(d.eg[n])).join(' • ');
  return `<div class="g" style="margin-top:8px"><div class="k">💰 Sale<b>${M(d.sale)}</b><small>${d.n} பதிவு • ${d.meter} m</small></div><div class="k">📈 Profit<b>${M(d.profit)}</b></div></div>
  ${sec('Sale பிரிவு')}${rw('💵 Cash',d.cashS)}${rw('📱 GPay',d.gpayS)}${rw('📒 Credit (கடன்)',d.credS)}${Math.abs(d.otherS)>0.004?rw('Other',d.otherS):''}
  ${sec('Credit வசூல் (இந்த நாள்)')}${rw('💵 Cash',d.cashP)}${rw('📱 GPay',d.gpayP)}${Math.abs(d.otherP)>0.004?rw('Other',d.otherP):''}
  ${sec('மொத்த வசூல்')}${rw('💵 Cash',d.cash)}${rw('📱 GPay',d.gpay)}
  ${sec('கணக்கு')}${rw('🧾 Purchase',d.purchase)}${rw('💸 Expense',d.expense,'red')}${d.exG>0?`<small>Cash ${M(d.exC)} • GPay ${M(d.exG)}</small>`:''}${egl?`<small>${egl}</small>`:''}${rw('Net Profit',d.net,d.net<0?'red':'grn')}
  <div class="k" style="margin-top:10px">கையில் Cash (மதிப்பீடு)<b class="${d.hand<0?'red':'grn'}">${M(d.hand)}</b><small>Cash விற்பனை + Cash வசூல் − Cash Expense</small></div>`;
}
function slToggle(){
  slOpen=!slOpen;$('slBody').classList.toggle('hide',!slOpen);$('slArr').textContent=slOpen?'▲ மூடு':'▼ பார்க்க';
}
function hlToggle(){
  hlOpen=!hlOpen;$('hlBody').classList.toggle('hide',!hlOpen);$('hlArr').textContent=hlOpen?'▲ மூடு':'▼ பார்க்க';
}
function deToggle(){
  deOpen=!deOpen;$('deBody').classList.toggle('hide',!deOpen);$('deArr').textContent=deOpen?'▲ மூடு':'▼ பார்க்க';
  if(deOpen)$('deBox').innerHTML=deBox();
}
function deText(){
  const d=dayData(deD),L=['📋 Day-end Report — '+fd(deD),'',
    'Sale: '+M(d.sale)+' ('+d.n+' பதிவு, '+d.meter+' m)','  Cash: '+M(d.cashS),'  GPay: '+M(d.gpayS),'  Credit: '+M(d.credS)];
  if(Math.abs(d.otherS)>0.004)L.push('  Other: '+M(d.otherS));
  L.push('','Credit வசூல்: Cash '+M(d.cashP)+' • GPay '+M(d.gpayP),'மொத்த வசூல்: Cash '+M(d.cash)+' • GPay '+M(d.gpay),'','Purchase: '+M(d.purchase),'Profit: '+M(d.profit),'Expense: '+M(d.expense)+(d.exG>0?' (Cash '+M(d.exC)+' • GPay '+M(d.exG)+')':''));
  Object.keys(d.eg).sort((x,y)=>d.eg[y]-d.eg[x]).forEach(n=>L.push('  '+n+': '+M(d.eg[n])));
  L.push('Net Profit: '+M(d.net),'','கையில் Cash (மதிப்பீடு): '+M(d.hand));
  return L.join('\n');
}
function deShare(){share(deText())}
function dePdf(){
  const d=dayData(deD),r=[['Sale',M(d.sale)],['  Cash',M(d.cashS)],['  GPay',M(d.gpayS)],['  Credit',M(d.credS)],['Credit வசூல் — Cash',M(d.cashP)],['Credit வசூல் — GPay',M(d.gpayP)],['மொத்த வசூல் — Cash',M(d.cash)],['மொத்த வசூல் — GPay',M(d.gpay)],['Purchase',M(d.purchase)],['Profit',M(d.profit)],['Expense',M(d.expense)+(d.exG>0?' (Cash '+M(d.exC)+' • GPay '+M(d.exG)+')':'')]];
  Object.keys(d.eg).sort((x,y)=>d.eg[y]-d.eg[x]).forEach(n=>r.push(['  '+n,M(d.eg[n])]));
  r.push(['Net Profit',M(d.net)],['கையில் Cash (மதிப்பீடு)',M(d.hand)]);
  pdf('Day-end Report '+fd(deD),tbl(['விவரம்','தொகை'],r)+'<p>'+d.n+' பதிவு • '+d.meter+' m</p>');
}


/* ---------- LEDGER COMPARISON ---------- */
function ledgerData(){try{const a=JSON.parse(localStorage.getItem('mass_sales_ledger_v1_6')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function cmpRows(){
  const m={},g=d=>m[d]||(m[d]={d,ss:0,sp:0,se:0,ls:0,lp:0,le:0});
  rd(KEY.entries).forEach(x=>{if(!x.date)return;const o=g(x.date);o.ss+=N(x.sale);o.sp+=N(x.purchase)});
  rd(KEY.exp).forEach(x=>{if(!x.date)return;g(x.date).se+=N(x.amount)});
  ledgerData().forEach(x=>{if(!x||!x.date)return;const o=g(String(x.date));o.ls+=N(x.sales);o.lp+=N(x.purchase);o.le+=N(x.expense)});
  return Object.values(m).filter(r=>(!cF||r.d>=cF)&&(!cT||r.d<=cT)).sort((a,b)=>b.d.localeCompare(a.d));
}
function cmpLn(l,a,b){
  const d=Math.round((a-b)*100)/100,bad=Math.abs(d)>0.5;
  return `<div style="display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:12px;padding:1px 0"><span style="min-width:54px;color:var(--m)">${l}</span><span>SPB ${M(a)}</span><span>Ledger ${M(b)}</span><b class="${bad?'red':'grn'}" style="min-width:64px;text-align:right">${bad?(d>0?'+':'')+M(d):'✓'}</b></div>`;
}
function cmpBody(){
  const rows=cmpRows(),bad=r=>Math.abs(r.ss-r.ls)>0.5||Math.abs(r.sp-r.lp)>0.5||Math.abs(r.se-r.le)>0.5;
  const show=cDiff?rows.filter(bad):rows,T=rows.reduce((o,r)=>{for(const k of ['ss','sp','se','ls','lp','le'])o[k]+=r[k];return o},{ss:0,sp:0,se:0,ls:0,lp:0,le:0});
  return `<div class="k" style="margin-top:10px"><b style="font-size:14px;color:var(--t)">மொத்தம் (${rows.length} நாட்கள்)</b>${cmpLn('Sale',T.ss,T.ls)}${cmpLn('Purchase',T.sp,T.lp)}${cmpLn('Expense',T.se,T.le)}</div>
  <small style="margin-top:6px">வேறுபாடு = SPB − Ledger. Sale Profit Book-ன் Purchase = Item rate × Meter; Ledger-ன் Purchase = Mydeen கொள்முதல்.</small>
  ${show.map(r=>`<div style="border-top:1px solid var(--ln);padding:8px 0"><b>${fd(r.d)}</b>${cmpLn('Sale',r.ss,r.ls)}${cmpLn('Purchase',r.sp,r.lp)}${cmpLn('Expense',r.se,r.le)}</div>`).join('')||`<small style="margin-top:8px">${cDiff?'வேறுபாடு உள்ள நாட்கள் இல்லை ✓':'பதிவுகள் இல்லை'}</small>`}`;
}
function cmpControls(){
  return `<div class="g"><div><label>From</label><input type="date" value="${cF}" onchange="cF=this.value;cmpUpdate()"></div><div><label>To</label><input type="date" value="${cT}" onchange="cT=this.value;cmpUpdate()"></div></div>
  <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t)"><input type="checkbox" style="width:auto" ${cDiff?'checked':''} onchange="cDiff=this.checked;cmpUpdate()">வேறுபாடு உள்ள நாட்கள் மட்டும்</label>`;
}
function cmpUpdate(){const b=$('cmpIn');if(b)b.innerHTML=cmpBody()}
function cmpHtml(){return colCard('cmp','📊 நாள் வாரியான ஒப்பீடு',cmpControls()+'<div id="cmpIn">'+cmpBody()+'</div>')}
