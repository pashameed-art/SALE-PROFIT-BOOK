<script id="v634-sterling-duplicate-fix">
(function(){
  try{
    const KEY='spb_v4_stock';
    let a=JSON.parse(localStorage.getItem(KEY)||'[]');
    if(!Array.isArray(a)) return;
    const cleaned=a.filter(x=>{
      const item=String(x.item||'').trim().toLowerCase();
      const date=String(x.date||'').slice(0,10);
      const type=String(x.type||'').toLowerCase();
      const meter=Number(x.meter||0);
      return !(item==='sterling' && date==='2026-09-06' && type==='stock out' && meter===21);
    });
    localStorage.setItem(KEY,JSON.stringify(cleaned));
    if(typeof stockMovements!=='undefined') stockMovements=cleaned;
    if(typeof renderStock==='function') renderStock();
  }catch(e){}
})();
</script>

<script id="v635-stock-protection">
(function(){
  try{
    const KEY='spb_v4_stock';
    let a=JSON.parse(localStorage.getItem(KEY)||'[]');
    if(!Array.isArray(a)) return;

    const seen=new Set();
    const cleaned=[];
    for(const x of a){
      const item=String(x.item||'').trim().toLowerCase();
      const date=String(x.date||'').slice(0,10);
      const type=String(x.type||'').trim().toLowerCase();
      const meter=Number(x.meter||0);

      // Prevent accidental duplicate Stock Out records for the same
      // item + date + meter. Keep the first record only.
      if(type==='stock out'){
        const sig=item+'|'+date+'|'+meter;
        if(seen.has(sig)) continue;
        seen.add(sig);
      }
      cleaned.push(x);
    }

    if(cleaned.length!==a.length){
      localStorage.setItem(KEY,JSON.stringify(cleaned));
      if(typeof stockMovements!=='undefined') stockMovements=cleaned;
      if(typeof renderStock==='function') renderStock();
    }
  }catch(e){}
})();
</script>

<script id="v641-stock-edit-visible">
(function(){
  function install(){
    const select=document.getElementById('stockItemSelect');
    if(!select || document.getElementById('v641StockEditor')) return;

    const host=select.closest('section') || select.parentElement;
    if(!host) return;

    const box=document.createElement('div');
    box.id='v641StockEditor';
    box.style.cssText='margin:14px 0;padding:14px;border:2px solid #888;border-radius:12px;background:var(--card,#fff);';
    box.innerHTML=`
      <div style="font-size:17px;font-weight:700;margin-bottom:10px">✏️ Stock Edit / Correction</div>
      <div style="font-size:13px;margin-bottom:8px">Existing Stock In / Stock Out பதிவுகளை edit அல்லது delete செய்யலாம்.</div>
      <select id="v641Entry" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:9px">
        <option value="">Select Stock Entry</option>
      </select>
      <div id="v641Fields" style="display:none;margin-top:9px">
        <label style="display:block;font-size:12px;margin-bottom:3px">Date</label>
        <input id="v641Date" type="date" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:9px">
        <label style="display:block;font-size:12px;margin:7px 0 3px">Meter</label>
        <input id="v641Meter" type="number" min="0" step="0.01" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:9px">
        <div style="display:flex;gap:8px;margin-top:9px">
          <button id="v641Save" type="button" style="flex:1;padding:10px">💾 Save</button>
          <button id="v641Delete" type="button" style="flex:1;padding:10px">🗑️ Delete</button>
        </div>
      </div>`;
    host.appendChild(box);

    const entry=box.querySelector('#v641Entry');
    const fields=box.querySelector('#v641Fields');
    const date=box.querySelector('#v641Date');
    const meter=box.querySelector('#v641Meter');

    function getData(){
      try{
        const a=JSON.parse(localStorage.getItem('spb_v4_stock')||'[]');
        return Array.isArray(a)?a:[];
      }catch(e){return []}
    }
    function load(){
      const a=getData();
      entry.innerHTML='<option value="">Select Stock Entry</option>'+a.map((x,i)=>
        `<option value="${i}">${String(x.date||'').slice(0,10)} — ${String(x.item||'')} — ${Number(x.meter||0).toFixed(2)} m — ${String(x.type||'Stock In')}</option>`
      ).join('');
      fields.style.display='none';
    }
    entry.addEventListener('change',function(){
      const a=getData(), i=Number(this.value);
      if(!Number.isInteger(i)||!a[i]){fields.style.display='none';return}
      date.value=String(a[i].date||'').slice(0,10);
      meter.value=Number(a[i].meter||0);
      fields.style.display='block';
    });
    box.querySelector('#v641Save').addEventListener('click',function(){
      const a=getData(), i=Number(entry.value), m=Number(meter.value);
      if(!Number.isInteger(i)||!a[i]) return;
      if(!date.value || !Number.isFinite(m) || m<0){alert('Date மற்றும் Meter சரியாக உள்ளிடவும்.');return}
      a[i].date=date.value;
      a[i].meter=m;
      localStorage.setItem('spb_v4_stock',JSON.stringify(a));
      if(typeof stockMovements!=='undefined') stockMovements=a;
      if(typeof renderStock==='function') renderStock();
      load();
    });
    box.querySelector('#v641Delete').addEventListener('click',function(){
      const a=getData(), i=Number(entry.value);
      if(!Number.isInteger(i)||!a[i]) return;
      if(!confirm('இந்த Stock entry-ஐ delete செய்யவா?')) return;
      a.splice(i,1);
      localStorage.setItem('spb_v4_stock',JSON.stringify(a));
      if(typeof stockMovements!=='undefined') stockMovements=a;
      if(typeof renderStock==='function') renderStock();
      load();
    });
    load();
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(install,700));
})();
</script>

(function(){
  function install(){
    if(document.getElementById('v642StockItemSummary')) return;
    const select=document.getElementById('stockItemSelect');
    if(!select) return;
    const host=select.closest('section') || select.parentElement;
    if(!host) return;

    const box=document.createElement('div');
    box.id='v642StockItemSummary';
    box.style.cssText='margin:12px 0;padding:12px;border:1px solid #ddd;border-radius:12px;';
    box.innerHTML=`
      <div style="font-weight:700;margin-bottom:8px">📊 Stock Item Summary</div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;text-align:center">
        <div style="padding:8px;border:1px solid #ddd;border-radius:9px"><small>Added</small><div id="v642Added" style="font-weight:700">0 m</div></div>
        <div style="padding:8px;border:1px solid #ddd;border-radius:9px"><small>Sold</small><div id="v642Sold" style="font-weight:700">0 m</div></div>
        <div style="padding:8px;border:1px solid #ddd;border-radius:9px"><small>Balance</small><div id="v642Balance" style="font-weight:700">0 m</div></div>
      </div>`;
    host.appendChild(box);

    function refresh(){
      try{
        const item=select.value;
        let a=JSON.parse(localStorage.getItem('spb_v4_stock')||'[]');
        if(!Array.isArray(a)) a=[];
        const rows=a.filter(x=>String(x.item||'')===item);
        const added=rows.filter(x=>String(x.type||'Stock In').toLowerCase()!=='stock out')
          .reduce((s,x)=>s+Number(x.meter||0),0);
        const sold=rows.filter(x=>String(x.type||'').toLowerCase()==='stock out')
          .reduce((s,x)=>s+Number(x.meter||0),0);
        document.getElementById('v642Added').textContent=added.toFixed(2)+' m';
        document.getElementById('v642Sold').textContent=sold.toFixed(2)+' m';
        document.getElementById('v642Balance').textContent=(added-sold).toFixed(2)+' m';
      }catch(e){}
    }
    select.addEventListener('change',()=>setTimeout(refresh,50));
    refresh();
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(install,800));
})();
</script>

<script id="v643-stock-filter">
(function(){
  function install(){
    if(document.getElementById('v643StockFilter')) return;
    const select=document.getElementById('stockItemSelect');
    if(!select) return;
    const host=select.closest('section') || select.parentElement;
    if(!host) return;

    const box=document.createElement('div');
    box.id='v643StockFilter';
    box.style.cssText='margin:12px 0;padding:12px;border:1px solid #ddd;border-radius:12px;';
    box.innerHTML=`
      <div style="font-weight:700;margin-bottom:8px">🔎 Stock Transaction Filter</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div><label style="font-size:12px">From Date</label><input id="v643From" type="date" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:9px"></div>
        <div><label style="font-size:12px">To Date</label><input id="v643To" type="date" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:9px"></div>
      </div>
      <select id="v643Type" style="width:100%;box-sizing:border-box;margin-top:8px;padding:9px;border:1px solid #bbb;border-radius:9px">
        <option value="all">All Transactions</option>
        <option value="in">Stock In Only</option>
        <option value="out">Sold Only</option>
      </select>
      <button id="v643Apply" type="button" style="width:100%;margin-top:8px;padding:10px">Apply Filter</button>
      <button id="v643Clear" type="button" style="width:100%;margin-top:6px;padding:9px">Clear Filter</button>
      <div id="v643Result" style="margin-top:10px"></div>`;
    host.appendChild(box);

    function render(){
      try{
        const item=select.value;
        let a=JSON.parse(localStorage.getItem('spb_v4_stock')||'[]');
        if(!Array.isArray(a)) a=[];
        const from=box.querySelector('#v643From').value;
        const to=box.querySelector('#v643To').value;
        const type=box.querySelector('#v643Type').value;

        let rows=a.filter(x=>!item || String(x.item||'')===item);
        rows=rows.filter(x=>{
          const d=String(x.date||'').slice(0,10);
          if(from && d<from) return false;
          if(to && d>to) return false;
          const out=String(x.type||'').toLowerCase()==='stock out';
          if(type==='in' && out) return false;
          if(type==='out' && !out) return false;
          return true;
        }).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));

        const added=rows.filter(x=>String(x.type||'Stock In').toLowerCase()!=='stock out').reduce((s,x)=>s+Number(x.meter||0),0);
        const sold=rows.filter(x=>String(x.type||'').toLowerCase()==='stock out').reduce((s,x)=>s+Number(x.meter||0),0);
        box.querySelector('#v643Result').innerHTML=
          `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center">
            <div><small>Entries</small><br><b>${rows.length}</b></div>
            <div><small>Added</small><br><b>${added.toFixed(2)} m</b></div>
            <div><small>Sold</small><br><b>${sold.toFixed(2)} m</b></div>
          </div>`;
      }catch(e){}
    }
    box.querySelector('#v643Apply').addEventListener('click',render);
    box.querySelector('#v643Clear').addEventListener('click',()=>{
      box.querySelector('#v643From').value='';
      box.querySelector('#v643To').value='';
      box.querySelector('#v643Type').value='all';
      render();
    });
    select.addEventListener('change',()=>setTimeout(render,50));
    render();
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(install,900));
})();
</script>

<script id="v644-stock-report">
(function(){
  function install(){
    if(document.getElementById('v644StockReport')) return;
    const select=document.getElementById('stockItemSelect');
    if(!select) return;
    const host=select.closest('section') || select.parentElement;
    if(!host) return;

    const box=document.createElement('div');
    box.id='v644StockReport';
    box.style.cssText='margin:14px 0;padding:14px;border:1px solid #ddd;border-radius:12px;';
    box.innerHTML=`
      <div style="font-weight:700;font-size:17px;margin-bottom:9px">📊 Stock Report</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px">
        <input id="v644From" type="date" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:9px">
        <input id="v644To" type="date" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:9px">
      </div>
      <input id="v644Search" type="search" placeholder="🔎 Search Item..." style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:9px;margin-bottom:8px">
      <div id="v644Table" style="overflow:auto"></div>`;
    host.appendChild(box);

    const from=box.querySelector('#v644From');
    const to=box.querySelector('#v644To');
    const search=box.querySelector('#v644Search');
    const table=box.querySelector('#v644Table');

    function render(){
      try{
        let items=JSON.parse(localStorage.getItem('spb_v4_items')||'[]');
        let moves=JSON.parse(localStorage.getItem('spb_v4_stock')||'[]');
        if(!Array.isArray(items)) items=[];
        if(!Array.isArray(moves)) moves=[];

        const names=new Set(items.filter(x=>x && x.name && !x.hidden).map(x=>String(x.name)));
        moves.forEach(x=>{if(x && x.item) names.add(String(x.item));});

        const q=search.value.trim().toLowerCase();
        const rows=[...names].filter(n=>!q || n.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b));

        const html=rows.map(name=>{
          const tx=moves.filter(x=>{
            if(String(x.item||'')!==name) return false;
            const d=String(x.date||'').slice(0,10);
            if(from.value && d<from.value) return false;
            if(to.value && d>to.value) return false;
            return true;
          });
          const added=tx.filter(x=>String(x.type||'Stock In').toLowerCase()!=='stock out').reduce((s,x)=>s+Number(x.meter||0),0);
          const sold=tx.filter(x=>String(x.type||'').toLowerCase()==='stock out').reduce((s,x)=>s+Number(x.meter||0),0);
          return `<tr><td style="padding:7px">${name}</td><td style="padding:7px;text-align:right">${added.toFixed(2)} m</td><td style="padding:7px;text-align:right">${sold.toFixed(2)} m</td><td style="padding:7px;text-align:right;font-weight:700">${(added-sold).toFixed(2)} m</td></tr>`;
        }).join('');

        table.innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr><th style="text-align:left;padding:7px">Item</th><th style="text-align:right;padding:7px">Added</th><th style="text-align:right;padding:7px">Sold</th><th style="text-align:right;padding:7px">Balance</th></tr></thead>
          <tbody>${html||'<tr><td colspan="4" style="padding:10px;text-align:center">No stock data</td></tr>'}</tbody>
        </table>`;
      }catch(e){}
    }
    [from,to,search].forEach(x=>x.addEventListener('input',render));
    render();
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(install,1000));
})();
</script>

<script id="v645-sales-profit">
(function(){
  function money645(n){
    return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
  }
  function date645(v){return String(v||'').slice(0,10);}
  function install(){
    if(document.getElementById('v645SalesProfit')) return;
    const page=document.getElementById('reportPage');
    if(!page) return;
    const box=document.createElement('div');
    box.id='v645SalesProfit';
    box.className='history-card';
    box.style.cssText='margin-top:14px;padding:14px;';
    box.innerHTML=`
      <div style="font-weight:700;font-size:17px;margin-bottom:9px">📈 Sales &amp; Profit</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px">
        <div><label style="font-size:12px">From Date</label><input id="v645From" type="date" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:9px"></div>
        <div><label style="font-size:12px">To Date</label><input id="v645To" type="date" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:9px"></div>
      </div>
      <button id="v645Apply" type="button" class="primary" style="width:100%;padding:10px">📊 Generate Sales &amp; Profit</button>
      <div id="v645Result" style="margin-top:12px"></div>`;
    page.appendChild(box);
    const from=box.querySelector('#v645From'),to=box.querySelector('#v645To'),result=box.querySelector('#v645Result');
    function render(){
      let sales=[];
      try{sales=Array.isArray(entries)?entries.slice():JSON.parse(localStorage.getItem('spb_v4_entries')||'[]');}catch(e){sales=[];}
      const f=from.value,t=to.value;
      if(f) sales=sales.filter(x=>date645(x.date)>=f);
      if(t) sales=sales.filter(x=>date645(x.date)<=t);
      const map={};
      sales.forEach(x=>{
        const name=String(x.item||'Unknown').trim()||'Unknown';
        if(!map[name]) map[name]={meter:0,sale:0,purchase:0,profit:0,qty:0};
        map[name].meter+=Number(x.meter||0);
        map[name].sale+=Number(x.sale||0);
        map[name].purchase+=Number(x.purchase||0);
        map[name].profit+=Number(x.profit||0);
        map[name].qty++;
      });
      const rows=Object.entries(map).sort((a,b)=>b[1].profit-a[1].profit);
      const totals=rows.reduce((a,[,v])=>{a.meter+=v.meter;a.sale+=v.sale;a.purchase+=v.purchase;a.profit+=v.profit;a.qty+=v.qty;return a;},{meter:0,sale:0,purchase:0,profit:0,qty:0});
      const html=rows.map(([name,v])=>{
        const margin=v.sale?((v.profit/v.sale)*100):0;
        return `<tr><td style="padding:7px;white-space:nowrap">${String(name).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</td><td style="padding:7px;text-align:right">${v.meter.toFixed(2)}</td><td style="padding:7px;text-align:right">${money645(v.sale)}</td><td style="padding:7px;text-align:right">${money645(v.purchase)}</td><td style="padding:7px;text-align:right;font-weight:700">${money645(v.profit)}</td><td style="padding:7px;text-align:right">${margin.toFixed(1)}%</td></tr>`;
      }).join('');
      result.innerHTML=`
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;margin-bottom:10px">
          <div><small>Sale</small><br><b>${money645(totals.sale)}</b></div>
          <div><small>Purchase</small><br><b>${money645(totals.purchase)}</b></div>
          <div><small>Profit</small><br><b>${money645(totals.profit)}</b></div>
          <div><small>Entries</small><br><b>${totals.qty}</b></div>
        </div>
        <div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr><th style="text-align:left;padding:7px">Item</th><th style="text-align:right;padding:7px">Meter</th><th style="text-align:right;padding:7px">Sale</th><th style="text-align:right;padding:7px">Purchase</th><th style="text-align:right;padding:7px">Profit</th><th style="text-align:right;padding:7px">Margin</th></tr></thead>
          <tbody>${html||'<tr><td colspan="6" style="padding:12px;text-align:center">No sales data</td></tr>'}</tbody>
          ${rows.length?`<tfoot><tr style="font-weight:800;border-top:2px solid #999"><td style="padding:7px">TOTAL</td><td style="padding:7px;text-align:right">${totals.meter.toFixed(2)}</td><td style="padding:7px;text-align:right">${money645(totals.sale)}</td><td style="padding:7px;text-align:right">${money645(totals.purchase)}</td><td style="padding:7px;text-align:right">${money645(totals.profit)}</td><td style="padding:7px;text-align:right">${totals.sale?((totals.profit/totals.sale)*100).toFixed(1):'0.0'}%</td></tr></tfoot>`:''}
        </table></div>`;
    }
    box.querySelector('#v645Apply').addEventListener('click',render);
    document.addEventListener('click',e=>{
      const b=e.target.closest('button');
      if(b && b.textContent.includes('Reports')) setTimeout(render,150);
    });
    render();
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(install,1100));
})();
</script>
