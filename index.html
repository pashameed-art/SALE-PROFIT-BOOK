<script>
'use strict';
/* If the browser storage is full, tell the user instead of silently losing the entry. */
(function(){
  const orig=Storage.prototype.setItem;let last=0;
  Storage.prototype.setItem=function(k,v){
    try{return orig.call(this,k,v)}
    catch(e){
      if(Date.now()-last>3000){last=Date.now();
        try{alert('⚠️ Phone-ன் சேமிப்பிடம் நிரம்பிவிட்டது!\n\nஇந்தப் பதிவு சேமிக்கப்படவில்லை.\n\nBackup tab-ல் Backup All எடுத்து, தேவையற்ற பழைய data-வை நீக்கவும்.\nStorage full — this entry was NOT saved.')}catch(x){}}
      throw e;
    }
  };
})();
const KEY={items:'spb_v4_items',entries:'spb_v4_entries',exp:'spb_v4_expenses',stock:'spb_v4_stock',pay:'spb_credit_payments_v1',cus:'spb_credit_customers_v1'};
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>{v=Number(v);return isFinite(v)?v:0};
const M=n=>(N(n)<0?'−':'')+'₹'+Math.abs(N(n)).toLocaleString('en-IN',{maximumFractionDigits:2});
const rd=k=>{try{const a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}};
let _quotaAt=0;
function quotaFail(){const n=Date.now();if(n-_quotaAt<4000)return;_quotaAt=n;alert('⚠️ சேமிப்பிடம் நிரம்பிவிட்டது! இந்த மாற்றம் சேமிக்கப்படவில்லை.\n\nBackup All எடுத்து, தேவையற்ற பழைய பதிவுகளை நீக்கிய பிறகு மீண்டும் முயற்சிக்கவும்.\n\nStorage is full — this change was NOT saved.')}
const wr=(k,a)=>{try{const o=localStorage.getItem(k);if(o){try{JSON.parse(o)}catch(e){try{localStorage.setItem('spb_corrupt_'+k+'_'+Date.now(),o)}catch(e2){}}}}catch(e){}
  let tid=null;try{tid=trashHook(k,a)}catch(e){}
  try{localStorage.setItem(k,JSON.stringify(a));if(tid)setTimeout(()=>{try{trashToast(tid)}catch(e){}},0);return true}catch(e){quotaFail();return false}};
const sset=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ydy=()=>{const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const VER='9.43';
const ek=s=>encodeURIComponent(String(s)).replace(/'/g,'%27');
const dk=s=>{try{return decodeURIComponent(s)}catch(e){return s}};
const mobOf=n=>{const k=nm(n).toLowerCase(),c=rd(KEY.cus).find(x=>x&&x.key===k);return c&&c.mobile||''};
function saveMob(name,v){
  const d=String(v||'').replace(/[^\d]/g,'').replace(/^91(?=\d{10}$)/,'').replace(/^0(?=\d{10}$)/,'');
  if(!d)return true;
  if(!/^[6-9]\d{9}$/.test(d)){alert('சரியான 10 இலக்க Mobile No உள்ளிடவும்.');return false}
  const key=nm(name).toLowerCase(),a=rd(KEY.cus).filter(x=>x&&x.key!==key);a.push({key,name:nm(name),mobile:d});wr(KEY.cus,a);return true;
}
const LS_LIMIT=5*1024*1024; // about 5 million characters per site in most phone browsers
function storageUse(){
  const g={'Sale Profit Book':0,'Ledger':0,'Bike':0,'Home Expense':0,'Other':0};let tot=0;
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k)continue;
    const n=k.length+String(localStorage.getItem(k)||'').length;tot+=n;
    const a=/^(spb|saleProfitBook)/.test(k)?'Sale Profit Book':/^mass_(sales_)?ledger/.test(k)?'Ledger':/^massBikeV4_/.test(k)?'Bike':/^homeExpenseLedger/.test(k)?'Home Expense':'Other';
    g[a]+=n}
  return {g,tot,pct:Math.min(100,Math.round(tot/LS_LIMIT*100))};
}
const fmtKB=n=>n>=1048576?(n/1048576).toFixed(2)+' MB':Math.round(n/1024)+' KB';
function storageCard(){
  const u=storageUse(),col=u.pct>=85?'#c62828':u.pct>=60?'#e08a00':'#16834b';
  return `<div class="card"><b>💽 சேமிப்பிடம்</b><small>சுமார் ${u.pct}% (${fmtKB(u.tot)} / 5 MB) — நான்கு app-களும் இதைப் பகிர்கின்றன</small>
  <div style="height:10px;border-radius:5px;background:#e3ebeb;overflow:hidden;margin:8px 0"><div style="width:${u.pct}%;height:100%;background:${col}"></div></div>
  ${Object.keys(u.g).filter(k=>u.g[k]>0).map(k=>`<div class="row" style="padding:6px 0"><span>${k}</span><b>${fmtKB(u.g[k])}</b></div>`).join('')}
  ${u.pct>=80?`<small class="red" style="margin-top:6px">⚠️ நிரம்பும் நிலையில் உள்ளது. Backup All எடுத்து, தேவையற்ற பழைய பதிவுகளை நீக்குங்கள்.</small>`:'<small style="margin-top:6px">80%-ஐத் தாண்டினால் Home-ல் எச்சரிக்கை வரும்.</small>'}</div>`;
}
function storageBanner(){
  const u=storageUse();if(u.pct<80)return '';
  return `<div class="card red"><b>⚠️ சேமிப்பிடம் ${u.pct}% நிரம்பிவிட்டது</b><small>முழுதாக நிரம்பினால் புதிய பதிவுகள் சேமிக்கப்படாது.</small><button onclick="tab='bak';render();scrollTo(0,0)">💽 பார்க்க / Backup</button></div>`;
}
function backupBanner(){
  if(!rd(KEY.entries).length)return '';
  const ts=['spb_last_gdrive_backup_at','spb_v9_last_backup'].map(k=>Date.parse(localStorage.getItem(k)||'')).filter(x=>isFinite(x));
  const last=ts.length?Math.max(...ts):0,days=last?Math.floor((Date.now()-last)/864e5):-1;
  if(last&&days<7)return '';
  return `<div class="card red"><b>⚠️ Backup நினைவூட்டல்</b><small>${last?days+' நாட்களாக Backup எடுக்கவில்லை.':'இன்னும் Backup எடுக்கவில்லை.'} உங்கள் data இந்த phone-ல் மட்டுமே உள்ளது.</small><button onclick="tab='bak';render();scrollTo(0,0)">☁️ இப்போது Backup</button></div>`;
}
const itemByName=n=>{const q=nm(n).toLowerCase(),a=rd(KEY.items);return a.find(i=>i.name===n)||a.find(i=>i.name.toLowerCase()===q)||null};
function recentItems(k){const seen=new Set(),o=[];rd(KEY.entries).slice().sort((a,b)=>N(b.id)-N(a.id)).forEach(x=>{const n=x.item;if(n&&!seen.has(n)&&itemByName(n)&&o.length<k){seen.add(n);o.push(itemByName(n).name)}});return o}
function recentCust(k){const seen=new Set(),o=[];rd(KEY.entries).slice().sort((a,b)=>N(b.id)-N(a.id)).forEach(x=>{const n=nm(x.customer),q=n.toLowerCase();if(x.paidBy==='Credit'&&n&&!seen.has(q)&&o.length<k){seen.add(q);o.push(n)}});return o}
const chip=(a,n)=>`<button type="button" class="s" style="margin:0;padding:6px 10px;font-size:13px" data-n="${E(n)}" onclick="${a}">${E(n)}</button>`;
const chipBox=h=>h?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${h}</div>`:'';
function pickItem(n){$('eItem').value=n;calc();$('eMeter').focus()}
function pickCust(n,p){$(p+'Cus').value=n;$(p+'Mob').value=mobOf(n)}
const lastPlace=()=>localStorage.getItem('spb_v9_place')||'Kadayanallur';
const places=()=>[...new Set(rd(KEY.entries).map(x=>String(x.place||'').trim()).filter(Boolean))];
const nm=s=>String(s||'').replace(/\s+/g,' ').trim();
const fd=v=>{const p=String(v||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v};
let tab='home',cbKey=null,from=today(),to=today(),pw='Mansoor',pEdit=null,editId=null,mixOpen=false,mx=[];
const TABS=[['home','🏠 Home'],['hist','📜 History'],['stock','📦 Stock'],['exp','💸 Expense'],['credit','📒 Credit'],['party','🤝 Party'],['ledger','📗 Ledger'],['bike','🏍️ Bike'],['hexp','🏡 Home Exp'],['police','🚓 Police'],['bak','☁️ Backup']];

function stockOf(item){
  const mv=rd(KEY.stock).filter(x=>x.item===item);
  const inn=mv.filter(x=>String(x.type||'Stock In')!=='Stock Out').reduce((a,x)=>a+N(x.meter),0);
  const out=mv.filter(x=>x.type==='Stock Out').reduce((a,x)=>a+N(x.meter),0);
  const sold=rd(KEY.entries).filter(x=>x.item===item).reduce((a,x)=>a+N(x.meter),0);
  return Math.round((inn-out-sold)*100)/100;
}
function ledger(){
  const m={};const g=n=>{const k=nm(n).toLowerCase();return m[k]||(m[k]={name:nm(n),sale:0,paid:0,last:''})};
  rd(KEY.entries).forEach(x=>{if(x.paidBy!=='Credit')return;const c=g(x.customer||'(பெயர் இல்லை)');c.sale+=N(x.sale);if(String(x.date)>=c.last)c.last=String(x.date)});
  rd(KEY.pay).forEach(p=>{if(nm(p.customer))g(p.customer).paid+=N(p.amount)});
  return Object.values(m).map(c=>({...c,due:Math.round((c.sale-c.paid)*100)/100}));
}
function names(){return ledger().map(c=>c.name).sort()}

/* ---------- HOME ---------- */
function bkWarn(){
  const ts=[localStorage.getItem('spb_last_gdrive_backup_at'),localStorage.getItem('spb_v9_last_backup')].map(x=>Date.parse(x||'')).filter(x=>isFinite(x));

  if(last&&days<7)return '';
  return `<div class="card red"><b>⚠️ Backup எடுக்கவும்</b><small>${last?'கடைசி backup '+days+' நாட்களுக்கு முன்.':'இன்னும் backup எடுக்கவில்லை.'} உங்கள் data இந்த phone-ல் மட்டுமே உள்ளது.</small><button onclick="tab='bak';render();scrollTo(0,0)">☁️ Backup tab-க்குச் செல்</button></div>`;
}
function vHome(){
  const bb=backupBanner()+storageBanner();
  const t=today(),en=rd(KEY.entries).filter(x=>x.date===t),ex=rd(KEY.exp).filter(x=>x.date===t);

  const it=rd(KEY.items).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const low=it.filter(i=>i.min>0&&stockOf(i.name)<=i.min);
  const ed=editId!==null?rd(KEY.entries).find(x=>String(x.id)===editId):null;
  return `${bb}  <div class="card"><b>${ed?'✏️ Entry Edit':'📝 New Entry'}</b>${vBar('e','voiceSale')}

function calc(){
  const it=itemByName($('eItem').value),m=N($('eMeter').value),s=N($('eSale').value);
  $('eStock').textContent=it?'Stock: '+stockOf(it.name)+' m • Rate ₹'+it.rate:'';
  $('eCalc').textContent=it&&m?`Purchase ${M(it.rate*m)} • Profit ${M(s-it.rate*m)}`:'';
}
function saveEntry(){
  let item=$('eItem').value;const meter=N($('eMeter').value),sale=N($('eSale').value),paid=$('ePay').value,cus=nm($('eCus')&&$('eCus').value);
  const it=itemByName(item);
  if(!it)return alert('பட்டியலில் உள்ள Item-ஐத் தேர்ந்தெடுக்கவும்.');
  item=it.name;
  if(!(meter>0))return alert('Meter உள்ளிடவும்.');
  if(!(sale>=0)||$('eSale').value==='')return alert('Sale தொகை உள்ளிடவும்.');
  if(paid==='Credit'&&!cus)return alert('Credit-க்கு Customer பெயர் தேவை.');
  if(paid==='Credit'&&!saveMob(cus,$('eMob').value))return;
  const a=rd(KEY.entries),old=editId!==null?a.find(x=>String(x.id)===editId):null;
  const st=stockOf(item)+(old&&old.item===item?N(old.meter):0);
  if(meter>st&&!confirm(`Stock ${st} m மட்டுமே உள்ளது. ${meter} m விற்கவா? (Stock minus ஆகும்)`))return;
  const rate=old&&old.item===item?N(old.rate)||it.rate:it.rate,purchase=rate*meter;
  const place=nm($('ePlace').value)||'Kadayanallur';sset('spb_v9_place',place);
  const b={date:$('eDate').value||today(),place,item,meter,rate,sale,paidBy:paid,purchase,profit:sale-purchase};
  if(old){const n={...old,...b};if(paid==='Credit')n.customer=cus;else delete n.customer;a[a.indexOf(old)]=n;editId=null}
  else{const n={id:Date.now(),...b,time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})};if(paid==='Credit')n.customer=cus;a.unshift(n)}
  wr(KEY.entries,a);render();
}

function mxSync(){mx=mx.map((_,i)=>({item:$('mxI'+i).value,meter:$('mxM'+i).value,sale:$('mxS'+i).value}))}
function mxDel(i){mxSync();mx.splice(i,1);render()}
function mxTot(){

}
function saveMixed(){
  mxSync();const its=rd(KEY.items),paid=$('mPay').value,cus=nm($('mCus').value);
  const rows=mx.filter(r=>r.item||N(r.meter)||N(r.sale));
  rows.forEach(r=>{const f=itemByName(r.item);if(f)r.item=f.name});
  if(!rows.length)return alert('குறைந்தது ஒரு Item சேர்க்கவும்.');
  for(const r of rows){if(!its.find(x=>x.name===r.item)||!(N(r.meter)>0)||r.sale===''||N(r.sale)<0)return alert('ஒவ்வொரு வரிக்கும் Item, Meter, Sale உள்ளிடவும்.')}
  if(paid==='Credit'&&!cus)return alert('Credit-க்கு Customer பெயர் தேவை.');
  if(paid==='Credit'&&!saveMob(cus,$('mMob').value))return;
  const need={};rows.forEach(r=>need[r.item]=(need[r.item]||0)+N(r.meter));
  const short=Object.keys(need).filter(k=>need[k]>stockOf(k));
  if(short.length&&!confirm('Stock போதாது: '+short.map(k=>k+' ('+stockOf(k)+' m)').join(', ')+'. தொடரவா? (Stock minus ஆகும்)'))return;
  const place=nm($('mPl').value)||'Kadayanallur';sset('spb_v9_place',place);
  const a=rd(KEY.entries),now=Date.now(),date=$('mDt').value||today(),gid='MS'+now,time=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
  rows.forEach((r,i)=>{const it=its.find(x=>x.name===r.item),m=N(r.meter),s=N(r.sale),pu=it.rate*m;
    const n={id:now+i,date,place,item:r.item,meter:m,rate:it.rate,sale:s,paidBy:paid,purchase:pu,profit:s-pu,time,mixedGroup:gid};
    if(paid==='Credit')n.customer=cus;a.unshift(n)});
  wr(KEY.entries,a);mixOpen=false;mx=[];render();
}

function restore(){
  const f=$('rf').files[0];if(!f)return alert('File தேர்ந்தெடுக்கவும்.');
  const r=new FileReader();r.onload=()=>{
    let d;try{d=JSON.parse(r.result)}catch(e){return alert('தவறான file.')}
    const s=d&&d.storage;if(!s||typeof s!=='object')return alert('இது Sale Profit Book backup அல்ல.');
    applyRestore(s);
  };r.readAsText(f);
}

/* ---------- GOOGLE DRIVE ---------- */
const GCID='123737120474-8sqc1sb4p0i9j7s9nq56j4gkd784lm1n.apps.googleusercontent.com',GPRE='SALE-PROFIT-BOOK-Backup-',GKEEP=10;
let gTok=null,gExp=0,gCli=null,gRej=null;
const gs=(m,ok)=>{const s=$('gSt');if(s){s.textContent=m;s.style.color=ok===false?'#c62828':'#126d66'}};
function gLoad(){return new Promise((ok,no)=>{
  if(window.google&&google.accounts&&google.accounts.oauth2)return ok();
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>ok();s.onerror=()=>no(new Error('Google library load ஆகவில்லை (Internet?)'));document.head.appendChild(s);
})}
async function gToken(){
  if(gTok&&Date.now()<gExp)return gTok;
  await gLoad();
  return new Promise((ok,no)=>{
    const cb=r=>{if(r&&r.access_token){gTok=r.access_token;gExp=Date.now()+Math.max(60,(Number(r.expires_in)||3600)-120)*1000;ok(gTok)}else no(new Error('Google authorization முடியவில்லை'))};
    gRej=no;try{if(!gCli)gCli=google.accounts.oauth2.initTokenClient({client_id:GCID,scope:'https://www.googleapis.com/auth/drive.file',callback:cb,error_callback:()=>{if(gRej)gRej(new Error('Google authorization முடியவில்லை'))}});else gCli.callback=cb;gCli.requestAccessToken({prompt:''})}catch(e){no(e)}
  });
}
async function gList(tok){
  const q="trashed = false and mimeType = 'application/json'";let f=[],pt='';
  do{
    const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&spaces=drive&pageSize=100&fields='+encodeURIComponent('nextPageToken,files(id,name,createdTime)')+(pt?'&pageToken='+encodeURIComponent(pt):''),{headers:{Authorization:'Bearer '+tok}});
    if(!r.ok)throw new Error('Drive file பட்டியல் கிடைக்கவில்லை');
    const d=await r.json();f=f.concat(d.files||[]);pt=d.nextPageToken||'';
  }while(pt&&f.length<500);
  return f.filter(x=>/^SALE-PROFIT-BOOK-/i.test(x.name||''));
}
async function gBackup(auto){
  try{
    gs('Google Drive-உடன் இணைகிறது…');
    const tok=await gToken(),now=new Date(),pad=n=>String(n).padStart(2,'0');
    const name=GPRE+now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'_'+pad(now.getHours())+'-'+pad(now.getMinutes())+'-'+pad(now.getSeconds())+'.json';
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify({name,mimeType:'application/json'})],{type:'application/json'}));
    form.append('file',new Blob([JSON.stringify(snap(),null,1)],{type:'application/json'}));
    gs('Upload ஆகிறது…');
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name',{method:'POST',headers:{Authorization:'Bearer '+tok},body:form});
    if(!r.ok)throw new Error('Drive upload தோல்வி');
    const id=(await r.json().catch(()=>({}))).id;
    sset('spb_last_gdrive_backup_at',now.toISOString());sset('spb_last_gdrive_backup_name',name);
    try{const dated=(await gList(tok)).filter(x=>x.name.indexOf(GPRE)===0).sort((a,b)=>a.name<b.name?1:-1);
      for(const f of dated.slice(GKEEP)){if(f.id===id)continue;await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(f.id),{method:'PATCH',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({trashed:true})})}}catch(e){}
    if(!auto||tab==='bak')render();gs('✅ Drive Backup முடிந்தது: '+name);
    return true;
  }catch(e){gs('❌ '+(e.message||e),false);return false}
}
async function gShowList(){
  try{
    gs('Drive backups தேடுகிறது…');
    const tok=await gToken(),f=(await gList(tok)).sort((a,b)=>String(b.createdTime).localeCompare(String(a.createdTime))).slice(0,10);
    $('gList').innerHTML=f.length?f.map(x=>`<div class="row"><div>${E(x.name)}<small>${new Date(x.createdTime).toLocaleString('en-IN')}</small></div><button class="s" style="margin:0" onclick="gRestore('${E(x.id)}')">Restore</button></div>`).join(''):'<small>Backup file எதுவும் இல்லை</small>';
    gs('Restore செய்ய வேண்டிய backup-ஐ தேர்ந்தெடுக்கவும்.');
  }catch(e){gs('❌ '+(e.message||e),false)}
}
async function gRestore(id){
  try{
    const tok=await gToken(),r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media',{headers:{Authorization:'Bearer '+tok}});
    if(!r.ok)throw new Error('File download ஆகவில்லை');
    const d=await r.json(),s=d&&d.storage;
    if(!s||typeof s!=='object')throw new Error('இது Sale Profit Book backup அல்ல');
    applyRestore(s);
  }catch(e){gs('❌ '+(e.message||e),false)}
}
function applyRestore(s){
  const ARR=/^(spb_v4_|spb_credit_|mass_sales_ledger_v1_6$|massBikeV4_(bikes|rentals|expenses|maintenance|challans)$|homeExpenseLedger(V1|FathimaV1)$|saleProfitBook(Mansoor|Mydeen|Supplier)V1$)/;
  const good=k=>{if(!ARR.test(k))return true;try{return Array.isArray(JSON.parse(s[k]))}catch(e){return false}};
  const skipped=Object.keys(s).filter(k=>typeof s[k]==='string'&&bkApp(k)&&!good(k));
  const ok=Object.keys(s).filter(k=>typeof s[k]==='string'&&bkApp(k)&&good(k));
  if(skipped.length)alert('⚠️ சேதமடைந்த பகுதிகள் தவிர்க்கப்பட்டன (தற்போதைய data அப்படியே இருக்கும்): '+skipped.join(', '));
  if(!ok.length){alert('இந்த file-ல் மீட்கக்கூடிய data இல்லை.');return}
  const apps=[...new Set(ok.map(bkApp))];
  if(!confirm('இந்த backup-ல் உள்ளவை: '+apps.join(', ')+'.\n\nRestore செய்தால் இந்த app-களின் தற்போதைய data மாற்றப்படும்; backup-ல் இல்லாத app-களின் data மாறாது.\n\nதொடரவா? (முன்னதாக தற்போதைய எல்லா data-வின் backup file தானாக download ஆகும்.)'))return;
  dl('SALE-PROFIT-BOOK-BEFORE-RESTORE-'+today()+'.json',JSON.stringify(snap(),null,1),'application/json');
  let failed=0;ok.forEach(k=>{try{localStorage.setItem(k,s[k])}catch(e){failed++}});
  if(failed){alert('⚠️ சேமிப்பிடம் போதவில்லை: '+failed+' பகுதிகள் மீட்கப்படவில்லை. முன்பு download ஆன backup file-ஐப் பத்திரமாக வைத்திருங்கள்.');}
  alert('✅ Restore முடிந்தது: '+apps.join(', ')+'.\n\nApp இப்போது மீண்டும் load ஆகும்.');
  location.reload();
}

async function pinHash(pin,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);

}

function stayOcrLoad(){
  if(window.Tesseract)return Promise.resolve();
  return new Promise((ok,no)=>{const t=document.createElement('script');t.src=OCR_URL;t.onload=ok;t.onerror=()=>no(new Error('OCR நூலகம் ஏற்ற முடியவில்லை (இணையம்?)'));document.head.appendChild(t)});

function stayParse(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.replace(/[|_~^*=<>{}\[\]\\]/g,' ').replace(/\s+/g,' ').trim()).filter(l=>l.length>2);
  // phones
  const ph=[];
  const rx=/(?:\+?91[\s-]?)?[6-9]\d{4}[\s-]?\d{5}|0\d{2,4}[\s-]?\d{6,8}/g;
  lines.forEach(l=>{(l.replace(/(\d)[\s.](?=\d)/g,'$1').match(rx)||[]).forEach(n=>{n=n.replace(/[\s-]/g,'').replace(/^\+?91(?=[6-9]\d{9}$)/,'');if(!ph.includes(n))ph.push(n)})});
  ph.sort((a,b)=>(/^[6-9]\d{9}$/.test(b)?1:0)-(/^[6-9]\d{9}$/.test(a)?1:0));
  // hotel
  const kw=/hotel|residen|resedenc|lodge|\binn\b|resort|homestay|home stay|tourist|rooms|suites|palace|plaza|tower|regency|international|park|stay/i;
  let hotel='';
  const cand=lines.filter(l=>kw.test(l)&&/[A-Za-z]{4}/.test(l)&&!/\d{6,}/.test(l));
  if(cand.length)hotel=cand[0];
  else{const up=lines.filter(l=>/^[A-Z0-9 .&'-]{5,}$/.test(l)&&!/\d{5,}/.test(l));if(up.length)hotel=up.sort((a,b)=>b.length-a.length)[0]}
  hotel=hotel.replace(/[^A-Za-z0-9 .&'-]/g,'').trim();
  // address / place
  let place='',addr='';
  const ai=lines.findIndex(l=>/\bdist|kerala|tamil\s*nadu|\b[5-7]\d{5}\b/i.test(l));
  if(ai>=0){
    const parts=lines[ai].split(',').map(x=>x.trim()).filter(Boolean);
    const p0=(parts[0]||'').replace(/[^A-Za-z .'-]/g,'').trim();
    if(/dist|kerala|nadu/i.test(p0)&&ai>0){
      const pv=lines[ai-1].split(',').map(x=>x.replace(/[^A-Za-z .'-]/g,'').trim()).filter(Boolean).pop()||'';
      if(pv.length>3&&!/^ph|^mob|^tel|road|near|hospital/i.test(pv))place=pv;else place=p0.replace(/\bdist\.?/i,'').trim();
    }
    else if(p0.length>3&&!/road|near|hospital|street|\brd\b|bypass|junction/i.test(p0))place=p0;
    else if(parts[1]){const p1=parts[1].replace(/[^A-Za-z .'-]/g,'').trim();if(p1.length>3&&!/dist|kerala|nadu/i.test(p1))place=p1}
    addr=lines.slice(Math.max(0,ai-1),ai+1).join(', ');
  }
  return{hotel,place,phone:ph[0]||'',others:ph.slice(1),addr:addr.slice(0,200)};
}
async function stayOcr(){
  const st=$('sOcrS');if(!st)return;
  const ed=stayEd!==null?stays().find(x=>String(x.id)===String(stayEd)):null;

  if(!src){st.textContent='முதலில் Card போட்டோ தேர்ந்தெடுக்கவும்.';return}
  if(!navigator.onLine){st.textContent='❌ இணையம் தேவை.';return}
  try{
    st.textContent='⏳ OCR ஏற்றுகிறது… (முதல்முறை சிறிது நேரம் ஆகும்)';
    await stayOcrLoad();

    const got=[];
    if(put('sHo',d.hotel))got.push('Hotel');

    if(put('sPh',d.phone))got.push('Phone');
    const extra=[d.others.length?'Other: '+d.others.join(', '):'',d.addr].filter(Boolean).join(' | ');
    if(extra&&put('sNt',extra))got.push('குறிப்பு');
    st.textContent=got.length?'✅ நிரப்பப்பட்டது: '+got.join(', ')+'. சரிபார்த்துத் திருத்தி Save செய்யவும்.':'⚠️ எழுத்துகளைத் தெளிவாகப் படிக்க முடியவில்லை. கைமுறையாக உள்ளிடவும்.';
  }catch(e){st.textContent='❌ OCR வேலை செய்யவில்லை (இணையம் / ஏற்றம்). கைமுறையாக உள்ளிடவும்.'}

function vTokens(t){
  t=String(t||'').normalize('NFC').replace(/[\u200b-\u200d\u2060\ufeff\u00ad]/g,'').toLowerCase().replace(/[௦-௯]/g,c=>TD[c]).replace(/(\d),(?=\d{3})/g,'$1').replace(/[₹]/g,' ₹ ').replace(/([^\d\s.])\.(?=\d)/g,'$1 ').replace(/[.,;:!?"()]/g,m=>m==='.'?'.':' ');

}
/* tokens -> [{type:'num',v,i0,i1}] */
function vNums(tk){
  const out=[];let i=0;
  while(i<tk.length){
    const w=tk[i];
    if(/^\d+(\.\d+)?$/.test(w)){out.push({v:parseFloat(w),i0:i,i1:i});i++;continue}
    if(w in NW||w in NK){
      let j=i,tot=0,cur=0;
      while(j<tk.length&&(tk[j] in NW||tk[j] in NK)){
        const x=tk[j];
        if(x in NK){cur=(cur||1)*NK[x];tot+=cur;cur=0}else cur+=NW[x];
        j++;
      }
      tot+=cur;out.push({v:tot,i0:i,i1:j-1});i=j;continue;
    }
    i++;
  }
  return out;
}

function vParseExp(text){

function vEd(a,b){a=String(a);b=String(b);if(Math.abs(a.length-b.length)>1)return 9;const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function vItem(tk,items){
  const bag=tk.filter(w=>/[a-z0-9]/.test(w));
  const sc=items.map(it=>{
    const parts=String(it.name).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    let hit=0;
    parts.forEach(p=>{if(bag.some(w=>w===p||(p.length>=5&&w.length>=5&&vEd(w,p)<=1)))hit++});
    return{name:it.name,hit,cov:parts.length?hit/parts.length:0,len:parts.length};
  }).filter(x=>x.hit>0).sort((a,b)=>b.hit-a.hit||b.cov-a.cov||a.len-b.len);
  if(!sc.length)return{item:'',cands:[]};
  const top=sc[0],sec=sc[1];
  const amb=sec&&sec.hit===top.hit&&!(top.cov===1&&sec.cov<1);

function vParseSale(text,items){
  const tk=vTokens(text),it=vItem(tk,items);

  const nameDig=(it.item?String(it.item).match(/\d+/g)||[]:[]).map(Number);
  nameDig.forEach(d=>{const k=nums.findIndex(n=>n.v===d);if(k>=0)nums.splice(k,1)});

    if(MU.test(nx)&&!meter)meter=n.v;

    else rest.push(n);
  });
  if(!meter&&!sale){if(rest.length>=2){meter=rest[0].v;sale=rest[rest.length-1].v}else if(rest.length===1)meter=rest[0].v}
  else if(meter&&!sale){if(rest.length)sale=rest[rest.length-1].v}
  else if(sale&&!meter){if(rest.length)meter=rest[0].v}
  let pay='';const j=' '+tk.join(' ')+' ';
  if(/ (gpay|g pay|google pay|ஜிபே|கூகுள் பே|ஜீபே) /.test(j))pay='GPay';

}

/* ---- Google Calendar API (தானாக) ---- */
let cTok=null,cExp=0,cCli=null,cRej=null;
async function gCalToken(){
  if(cTok&&Date.now()<cExp)return cTok;
  await gLoad();
  return new Promise((ok,no)=>{
    const cb=r=>{if(r&&r.access_token){cTok=r.access_token;cExp=Date.now()+Math.max(60,(Number(r.expires_in)||3600)-120)*1000;ok(cTok)}else no(new Error('Google authorization முடியவில்லை'+(r&&r.error?' ('+r.error+')':'')))};
    cRej=no;
    try{if(!cCli)cCli=google.accounts.oauth2.initTokenClient({client_id:GCID,scope:'https://www.googleapis.com/auth/calendar.events',callback:cb,error_callback:e=>{if(cRej)cRej(new Error('Google authorization முடியவில்லை'+(e&&e.type?' ('+e.type+')':'')))}});else cCli.callback=cb;cCli.requestAccessToken({prompt:''})}catch(e){no(e)}
  });
}
function calBody(r){
  const bf=r.before||3,mins=[...new Set([bf*1440,1440,0])].filter(m=>m<=bf*1440).sort((x,y)=>y-x);
  const o={
    summary:'🔔 '+r.title+(r.amount>0?' ₹'+r.amount:''),
    description:['Sale Profit Book நினைவூட்டல்',r.amount>0?'தொகை: ₹'+r.amount:'',r.note||''].filter(Boolean).join('\n'),
    start:{dateTime:r.due+'T09:00:00+05:30',timeZone:'Asia/Kolkata'},
    end:{dateTime:r.due+'T09:30:00+05:30',timeZone:'Asia/Kolkata'},
    reminders:{useDefault:false,overrides:mins.map(m=>({method:'popup',minutes:m}))}
  };
  if(r.repeat==='m')o.recurrence=['RRULE:FREQ=MONTHLY'];else if(r.repeat==='y')o.recurrence=['RRULE:FREQ=YEARLY'];
  return o;
}
async function calApi(method,id,body){
  const tok=await gCalToken();
  const url='https://www.googleapis.com/calendar/v3/calendars/primary/events'+(id?'/'+encodeURIComponent(id):'');
  const r=await fetch(url,{method,headers:Object.assign({Authorization:'Bearer '+tok},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
  if(r.status===204||r.status===404||r.status===410)return null;
  const j=await r.json().catch(()=>({}));
  if(!r.ok){
    const m=(j.error&&(j.error.message||''))||('HTTP '+r.status);
    if(/not been used|disabled|accessNotConfigured/i.test(m)||r.status===403&&/Calendar API/i.test(m))throw new Error('Google Cloud-ல் Calendar API இயக்கப்படவில்லை');
    if(r.status===401){cTok=null;throw new Error('Google அனுமதி காலாவதி — மீண்டும் முயற்சிக்கவும்')}
    if(r.status===403)throw new Error('Calendar அனுமதி இல்லை ('+m+')');
    throw new Error(m);
  }
  return j;
}

/* ---------- 📈 INSIGHTS ---------- */
const SLOW_DAYS=30;
function insData(){
  const t=new Date(today()+'T00:00:00'),dow=(t.getDay()+6)%7;           // Monday=0
  const ds=d=>ymd(d),add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
  const ws=add(t,-dow),lws=add(ws,-7),lwe=add(lws,dow);                 // இந்த வாரம்: திங்கள்–இன்று; கடந்த வாரம்: அதே நாட்கள்
  const E1=rd(KEY.entries),sum=(a,b)=>E1.filter(x=>String(x.date)>=a&&String(x.date)<=b).reduce((r,x)=>{r.s+=N(x.sale);r.p+=N(x.profit);r.m+=N(x.meter);return r},{s:0,p:0,m:0});
  const cur=sum(ds(ws),ds(t)),prev=sum(ds(lws),ds(lwe));
  // சிறந்த நாள்: கடந்த 8 வாரம், வாரநாள் வாரியான சராசரி Sale
  const from=ds(add(t,-56)),wd=[0,0,0,0,0,0,0],days=[new Set(),new Set(),new Set(),new Set(),new Set(),new Set(),new Set()];
  E1.filter(x=>String(x.date)>=from&&String(x.date)<=ds(t)).forEach(x=>{const d=new Date(String(x.date)+'T00:00:00'),k=(d.getDay()+6)%7;wd[k]+=N(x.sale);days[k].add(String(x.date))});
  const avg=wd.map((v,i)=>days[i].size?v/days[i].size:0),bi=avg.indexOf(Math.max(...avg));
  // மெதுவாக விற்கும் Items
  const last={};E1.forEach(x=>{if(String(x.date)>(last[x.item]||''))last[x.item]=String(x.date)});
  const slow=rd(KEY.items).map(i=>{const st=stockOf(i.name),la=last[i.name]||'',d=la?Math.floor((t-new Date(la+'T00:00:00'))/864e5):9999;return{name:i.name,st,la,d}}).filter(x=>x.st>0&&x.d>=SLOW_DAYS).sort((a,b)=>b.st-a.st);
  return{cur,prev,avg,bi,slow,dow};
}

  const chg=(c,p)=>p>0?(c>=p?'▲ ':'▼ ')+Math.abs(Math.round((c-p)/p*100))+'%':(c>0?'▲ புதிது':'—');

  const best=Math.max(...d.avg)>0?`<div class="row"><div><b>⭐ சிறந்த நாள்</b><small>கடந்த 8 வாரச் சராசரி</small></div><div style="text-align:right"><b>${W[d.bi]}</b><br><small>${M(d.avg[d.bi])}</small></div></div>`:'';
  const slow=d.slow.length?`<b style="display:block;margin-top:12px">🐢 மெதுவாக விற்கும் Items (${SLOW_DAYS}+ நாள்)</b>`+d.slow.slice(0,8).map(x=>`<div class="row"><div><b>${E(x.name)}</b><small>${x.d>=9999?'இதுவரை விற்கவில்லை':x.d+' நாள் விற்கவில்லை'}</small></div><b>${+x.st.toFixed(1)} m</b></div>`).join('')+(d.slow.length>8?`<small>மேலும் ${d.slow.length-8} Items…</small>`:''):'<small style="display:block;margin-top:10px">🐢 மெதுவாக விற்கும் Items இல்லை 👍</small>';
  return rows+best+slow;
}

const TRASH_KEY='spb_trash_v1';
const TR_LBL={spb_v4_items:'Item',spb_v4_entries:'Sale',spb_v4_expenses:'Expense',spb_v4_stock:'Stock',spb_credit_payments_v1:'Credit Payment',spb_credit_customers_v1:'Credit Customer',spb_v4_stays:'தங்கும் இடம்',saleProfitBookMansoorV1:'Mansoor',saleProfitBookMydeenV1:'Mydeen',saleProfitBookSupplierV1:'Supplier'};
const trGet=()=>{try{const a=JSON.parse(localStorage.getItem(TRASH_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}};
const trSet=a=>{try{localStorage.setItem(TRASH_KEY,JSON.stringify(a));return true}catch(e){return false}};
const trSame=(x,y)=>(x&&y&&x.id!==undefined&&y.id!==undefined)?String(x.id)===String(y.id):JSON.stringify(x)===JSON.stringify(y);
function trashHook(k,a){
  if(!Array.isArray(a)||!/^(spb|saleProfitBook)/.test(k)||/trash|corrupt/.test(k))return null;
  const old=rd(k);
  if(a.length>=old.length)return null;
  const removed=old.filter(o=>!a.some(n=>trSame(o,n)));
  if(!removed.length||removed.length>20)return null;   // பெரிய நீக்கல் (Delete All) — Backup பயன்படுத்தவும்
  const now=Date.now(),lim=now-30*864e5;
  let t=trGet().filter(x=>x.at>lim);
  let last=null;
  removed.forEach((r,i)=>{const rec=Object.assign({},r);if(rec.photo)delete rec.photo;last='t'+now+'_'+i;t.unshift({tid:last,key:k,rec,at:now})});
  trSet(t.slice(0,60));
  return last;
}
function trDesc(x){
  const r=x.rec||{};
  const nm=r.item||r.name||r.hotel||r.title||r.customer||r.note||'';
  const amt=r.sale!==undefined?r.sale:(r.amount!==undefined?r.amount:'');
  return [(TR_LBL[x.key]||x.key),r.date?fd(r.date):'',nm,amt!==''?M(amt):''].filter(Boolean).join(' • ');

function trashRestore(tid){

/* ---------- POLICE STATION FINDER ---------- */
let polState='',polDist='',polArea='',polRes=null,polShow=25,polBusy=false,polMsg='';
const polKm=(a,b,c,d)=>{const r=x=>x*Math.PI/180,R=6371,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function polGet(url,opt,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||25000);try{const r=await fetch(url,Object.assign({signal:c.signal},opt||{}));if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function polSearch(){
  const st=polState.trim(),di=polDist.trim(),ar=polArea.trim();
  if(!ar){alert('Place / Area உள்ளிடவும் (எ.கா. Eloor).');return}
  if(polBusy)return;
  polBusy=true;polRes=null;polShow=25;polMsg='🔎 இடம் தேடுகிறது…';render();
  try{
    const geo=p=>polGet('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=in&q='+encodeURIComponent(p.filter(Boolean).join(', ')),{headers:{'Accept':'application/json'}},15000);
    const g=await geo([ar,di,st,'India']),usedArea=true;
    if(!g.length){polMsg='❌ "'+[ar,di,st].filter(Boolean).join(', ')+'" என்ற இடம் கிடைக்கவில்லை. எழுத்துப்பிழை பார்க்கவும் அல்லது District சேர்க்கவும்.';polBusy=false;render();return}
    const lat=+g[0].lat,lon=+g[0].lon,place=(usedArea?ar+' — ':'')+g[0].display_name;
    polMsg='🚓 50 km சுற்றளவில் Police Station தேடுகிறது…';render();
    const ql='[out:json][timeout:25];(node["amenity"="police"](around:50000,'+lat+','+lon+');way["amenity"="police"](around:50000,'+lat+','+lon+'););out center tags;';
    let j=null,err=null;
    for(const ep of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){
      try{j=await polGet(ep,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(ql)},30000);break}catch(e){err=e}
    }
    if(!j)throw err||new Error('no data');
    const seen={};
    const list=(j.elements||[]).map(e=>{
      const la=e.lat!=null?e.lat:(e.center&&e.center.lat),lo=e.lon!=null?e.lon:(e.center&&e.center.lon);
      if(la==null||lo==null)return null;
      const t=e.tags||{};
      const name=t['name:en']||t.name||'Police Station (பெயர் இல்லை)';
      const addr=[t['addr:housename'],t['addr:street'],t['addr:suburb']||t['addr:place'],t['addr:city']||t['addr:district']].filter(Boolean).join(', ');
      return{name,addr,phone:t.phone||t['contact:phone']||'',la,lo,km:polKm(lat,lon,la,lo)};
    }).filter(x=>{if(!x)return false;const k=x.name+'|'+x.la.toFixed(3)+'|'+x.lo.toFixed(3);if(seen[k])return false;seen[k]=1;return true}).sort((a,b)=>a.km-b.km);
    polRes={place,list};polMsg='';
  }catch(e){polMsg='❌ தேட முடியவில்லை. இணைய இணைப்பைச் சரிபார்த்து மீண்டும் முயற்சிக்கவும்.'}
  polBusy=false;render();
}
function vPolice(){

    if(L.length>polShow)out+=`<button class="s" style="width:100%;margin-top:8px" onclick="polShow+=25;render()">மேலும் காட்டு (${L.length-polShow} மீதம்) ▼</button>`;

  if(btn){const x=document.createElement('button');x.className='s';x.textContent=btn;x.onclick=async()=>{abBar('☁️ Backup ஆகிறது…');const ok=await gBackup(true);if(ok){abBar('✅ Drive Backup முடிந்தது');setTimeout(()=>abBar(''),2500)}else abBar('❌ Backup தோல்வி. Backup tab-ல் முயற்சிக்கவும்.','மூடு')};w.appendChild(x)}
  const c=document.createElement('button');c.className='s';c.textContent='✕';c.onclick=()=>abBar('');w.appendChild(c);
  b.appendChild(w);
}
async function autoBak(){
  try{
    if(!autoBakOn()||autoBakBusy)return;
    if(pinOn()&&sessionStorage.getItem('spb_unlocked')!=='1')return;
    if(!navigator.onLine)return;
    if(!rd(KEY.entries).length&&!rd(KEY.exp).length)return;
    const t=today();
    const gl=localStorage.getItem('spb_last_gdrive_backup_at');
    const d=new Date(gl||0);
    if(gl&&ymd(d)===t)return;
    if(autoBakTried===t)return;
    autoBakTried=t;autoBakBusy=true;
    // முதலில் அமைதியாக முயற்சி (முன்பு அனுமதி கொடுத்திருந்தால் வேலை செய்யும்)
    let ok=false;
    try{await Promise.race([gToken(),new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),10000))]);ok=await gBackup(true)}catch(e){ok=false}
    if(ok){abBar('✅ இன்றைய Drive Backup தானாக முடிந்தது');setTimeout(()=>abBar(''),2500)}
    else abBar('☁️ இன்றைய Drive Backup எடுக்கவில்லை','Backup');
  }catch(e){}finally{autoBakBusy=false}
}

/* ---------- DAILY CAR RENT PROMPT ---------- */
const CAR_KEY='spb_carrent_amt';
const carAmt=()=>{const v=localStorage.getItem(CAR_KEY);return v===null?600:N(v)};
function carSet(){
  const v=prompt('தினசரி Car Rent தொகை ₹ (0 = கேட்க வேண்டாம்)',carAmt());
  if(v===null)return;
  const n=N(v);
  if(!(n>=0))return alert('சரியான தொகை உள்ளிடவும்.');
  localStorage.setItem(CAR_KEY,String(n));render();
}
const isCarRent=x=>String(x.name||'').toLowerCase().includes('car rent');
/* வேலை நாட்கள் சுழற்சி: தொடக்கம்–முடிவு (எ.கா. 01-20, 30-19) */
const CAR_CYC_KEY='spb_car_cycle';
const carCyc=()=>{const p=String(localStorage.getItem(CAR_CYC_KEY)||'01-20').split('-').map(Number);return{s:p[0]>=1&&p[0]<=31?p[0]:1,e:p[1]>=1&&p[1]<=31?p[1]:20}};
const carIn=ds=>{const d=+String(ds).slice(8,10),c=carCyc();return c.s<=c.e?(d>=c.s&&d<=c.e):(d>=c.s||d<=c.e)};
const carP2=n=>String(n).padStart(2,'0');
const carCycLbl=()=>{const c=carCyc();return carP2(c.s)+' – '+carP2(c.e)};
const CAR_PRE=['01-20','01-19','30-19','29-19'];
function carModalClose(){const o=document.getElementById('carModal');if(o)o.remove()}
function carNote(){
  const n=$('cNote'),d=($('cDt')||{}).value;if(!n)return;
  n.textContent=d?(carIn(d)?'✅ இந்தத் தேதி வேலை நாட்களுக்குள் ('+carCycLbl()+') உள்ளது':'⚠️ இந்தத் தேதி வேலை நாட்களுக்கு ('+carCycLbl()+') வெளியே உள்ளது'):'';
}
function carCycSel(v){
  const cu=$('cCus');
  if(v==='custom'){if(cu)cu.style.display='flex';return}
  if(cu)cu.style.display='none';
  try{localStorage.setItem(CAR_CYC_KEY,v)}catch(e){}
  carNote();
}
function carCycCus(){
  const a=Math.round(+($('cS')||{}).value),b=Math.round(+($('cE')||{}).value);
  if(!(a>=1&&a<=31&&b>=1&&b<=31))return;
  try{localStorage.setItem(CAR_CYC_KEY,carP2(a)+'-'+carP2(b))}catch(e){}
  carNote();
}
function carModal(t,amt){
  carModalClose();
  const c=carCyc(),cur=carP2(c.s)+'-'+carP2(c.e),isPre=CAR_PRE.includes(cur);
  const opts=CAR_PRE.map(v=>'<option value="'+v+'"'+(v===cur?' selected':'')+'>'+v.replace('-',' – ')+'</option>').join('')+'<option value="custom"'+(isPre?'':' selected')+'>மற்றவை…</option>';
  const o=document.createElement('div');o.id='carModal';
  o.style.cssText='position:fixed;inset:0;z-index:80;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto';
  o.innerHTML='<div style="background:#fff;border-radius:16px;padding:18px;width:100%;max-width:360px;box-shadow:0 8px 30px #0005"><b style="font-size:17px">🚗 Car Rent '+M(amt)+' Add செய்யவா?</b>'
   +'<label style="display:block;margin-top:12px">தேதி தேர்ந்தெடு</label><input type="date" id="cDt" value="'+t+'" oninput="carNote()" style="width:100%">'
   +'<label style="display:block;margin-top:10px">வேலை நாட்கள் (மாதச் சுழற்சி)</label><select id="cCyc" onchange="carCycSel(this.value)" style="width:100%">'+opts+'</select>'
   +'<div id="cCus" style="display:'+(isPre?'none':'flex')+';gap:8px;margin-top:8px"><input type="number" id="cS" min="1" max="31" value="'+c.s+'" oninput="carCycCus()" style="flex:1" placeholder="தொடக்கம்"><input type="number" id="cE" min="1" max="31" value="'+c.e+'" oninput="carCycCus()" style="flex:1" placeholder="முடிவு"></div>'
   +'<small id="cNote" style="display:block;margin:8px 0 12px"></small>'
   +'<div style="display:flex;gap:8px"><button onclick="carSave('+amt+')" style="flex:1">✅ Add</button><button class="s" onclick="carModalClose()" style="flex:1">இன்று வேண்டாம்</button></div><small style="display:block;margin-top:8px">GPay • 30–19 என்றால் 30-ம் தேதி முதல் அடுத்த மாதம் 19 வரை</small></div>';
  document.body.appendChild(o);carNote();
}
function carSave(amt){
  const d=($('cDt')||{}).value;
  if(!d){alert('தேதி தேர்ந்தெடுக்கவும்.');return}
  if(!carIn(d)&&!confirm('இந்தத் தேதி வேலை நாட்களுக்கு ('+carCycLbl()+') வெளியே உள்ளது. அப்படியும் சேர்க்கவா?'))return;
  const a=rd(KEY.exp);
  if(a.some(x=>x.date===d&&isCarRent(x))&&!confirm('அந்தத் தேதியில் Car Rent ஏற்கெனவே உள்ளது. மீண்டும் சேர்க்கவா?'))return;
  a.unshift({id:Date.now(),date:d,name:'Car Rent',amount:amt,paidBy:'GPay'});
  if(wr(KEY.exp,a)){carModalClose();render()}
}
function carAsk(){
  try{
    if(pinOn()&&sessionStorage.getItem('spb_unlocked')!=='1')return;
    if(document.getElementById('carModal'))return;
    const t=today();
    if(!carIn(t))return;               // வேலை நாட்கள் சுழற்சிக்குள் மட்டும்
    const amt=carAmt();if(!(amt>0))return;
    if(localStorage.getItem('spb_carrent_asked')===t)return;
    localStorage.setItem('spb_carrent_asked',t);
    if(rd(KEY.exp).some(x=>x.date===t&&isCarRent(x)))return;
    carModal(t,amt);
  }catch(e){}
}

function render(){
  const v={home:vHome,hist:vHist,stock:vStock,exp:vExp,credit:vCredit,party:vParty,ledger:()=>'',bike:()=>'',hexp:()=>'',police:vPolice,bak:vBak}[tab];
  $('app').innerHTML=v();{const lg=tab==='ledger',bk=tab==='bike',hx=tab==='hexp';$('app').style.display=(lg||bk||hx)?'none':'';$('lgW').style.display=lg?'block':'none';$('bkW').style.display=bk?'block':'none';$('hxW').style.display=hx?'block':'none';if(hx&&!$('hxF').getAttribute('src'))$('hxF').setAttribute('src','https://pashameed-art.github.io/Home-Expense-Ledger/');if(lg)$('cmpBox').innerHTML=cmpHtml();if(lg&&!$('lgF').getAttribute('src'))$('lgF').setAttribute('src','https://pashameed-art.github.io/mass-sales-ledger/');if(bk&&!$('bkF').getAttribute('src'))$('bkF').setAttribute('src','https://pashameed-art.github.io/Mass-Bike/')}try{const d=new Date();$('hd').textContent=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]+', '+d.getDate()+' '+['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()]+' '+d.getFullYear()}catch(e){}if(tab==='home'){calc();if(mixOpen)mxTot()}
  if(_hf&&tab==='hist'){const i=$('hQ');if(i){i.focus();const l=i.value.length;try{i.setSelectionRange(l,l)}catch(e){}}}_hf=0;
  const go=k=>`tab='${k}';cbKey=null;editId=null;mixOpen=false;iEdit=null;sOut=null;hq='';render();scrollTo(0,0)`;
  const nb=k=>{const x=TABS.find(v=>v[0]===k),p=x[1].split(' ');return `<button class="${k===tab?'on':''}" onclick="${go(k)}"><span class="ic">${p[0]}</span><span>${p.slice(1).join(' ')}</span></button>`};

render();lockIfNeeded();setTimeout(carAsk,600);setTimeout(autoBak,3000);
</script><script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('./sw-v9.js').catch(function(){})});
/* ---- Mass Bike: Customer-wise Outstanding (reads Bike app data from shared storage) ---- */
function coIST(){return new Date(Date.now()+19800000).toISOString().slice(0,10)}
function coDays(a,b){const d=Math.round((new Date(b)-new Date(a))/86400000);return d<1?1:d}
function coDMY(x){if(!x)return '-';const p=String(x).split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:x}
function coWa(p){const d=String(p||'').replace(/\D/g,'');return d.length===10?'91'+d:d}
function coData(){
  const rentals=rd('massBikeV4_rentals'),bikes=rd('massBikeV4_bikes'),t=coIST(),m={};
  rentals.forEach(r=>{
    if(!r)return;
    const name=String(r.customerName||'').trim()||'Unknown Customer',phone=String(r.customerPhone||'').replace(/\D/g,''),key=name.toLowerCase()+'|'+phone;
    let due=0;
    if(r.status==='active'){const paid=N(r.advance)+(r.payments||[]).reduce((s,x)=>s+N(x&&x.amount),0);due=Math.max(0,coDays(r.startDate,t)*N(r.rate)-paid)}
    else due=Math.max(0,N(r.balance));
    due=Math.round(due*100)/100;
    if(due<=0)return;
    const bk=bikes.find(b=>b&&b.id===r.bikeId);
    if(!m[key])m[key]={name:name,phone:phone,due:0,items:[]};
    m[key].due+=due;
    m[key].items.push({bike:(r.bikeName||'Bike')+(bk&&bk.plate?' ('+bk.plate+')':''),start:r.startDate,status:r.status});
  });
  return Object.values(m).sort((a,b)=>b.due-a.due);
}
function coOpen(){
  const rows=coData();window.__coRows=rows;
  const tot=rows.reduce((s,c)=>s+c.due,0);
  $('coBody').innerHTML=rows.length
    ?'<div class="card"><div class="row"><span><b>மொத்த பாக்கி</b><small>'+rows.length+' customer(s)</small></span><b class="red" style="font-size:18px">'+M(tot)+'</b></div></div>'
      +rows.map((c,i)=>'<div class="card"><div class="row"><span><b>'+E(c.name)+'</b><small>'+E(c.phone||'Phone இல்லை')+' · '+c.items.length+' rental(s)</small></span><b class="red">'+M(c.due)+'</b></div>'
        +c.items.map(it=>'<div style="font-size:12.5px;color:var(--m);padding:3px 0">'+E(it.bike)+' · '+coDMY(it.start)+' · '+(it.status==='active'?'Active (ஓடுது)':'Returned')+'</div>').join('')
        +'<div style="display:flex;gap:8px"><button onclick="coWhats('+i+')" style="flex:1;margin-top:10px">📲 WhatsApp</button><button class="s" onclick="coCall('+i+')" style="flex:1;margin-top:10px">📞 Call</button></div></div>').join('')
    :'<div class="card" style="text-align:center">✅ பாக்கி எதுவும் இல்லை</div>';
  $('coOv').style.display='block';$('coOv').scrollTop=0;
}
function coClose(){$('coOv').style.display='none'}
function coWhats(i){
  const c=(window.__coRows||[])[i];if(!c)return;
  if(!c.phone){alert('Phone number இல்லை / No phone number saved');return}
  let t='வணக்கம் '+c.name+',\nMASS BIKE-ல உங்களுக்கு மொத்த பாக்கி ₹'+Math.round(c.due*100)/100+'.\n\n';
  c.items.forEach(it=>{t+='• '+it.bike+' — '+coDMY(it.start)+' ('+(it.status==='active'?'Active':'Returned')+')\n'});
  t+='\nதயவுசெய்து விரைவில் செலுத்தவும். நன்றி!\n\nHello '+c.name+', please settle your pending balance with MASS BIKE at your earliest. Thank you!';
  window.open('https://wa.me/'+coWa(c.phone)+'?text='+encodeURIComponent(t),'_blank');
}
function coCall(i){
  const c=(window.__coRows||[])[i];
  if(!c||!c.phone){alert('Phone number இல்லை / No phone number saved');return}
  window.location.href='tel:'+c.phone;
}
</script>
