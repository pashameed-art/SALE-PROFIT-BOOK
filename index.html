<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Sale Profit Book</title>
<style>
:root{--teal:#117d73;--light:#e9f3f2;--bg:#f5f8f8;--text:#263238;--muted:#708080;--line:#d8e1e0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{background:var(--teal);color:#fff;padding:28px 24px 24px}
h1{margin:0;font-size:26px} .version{margin-top:16px;font-weight:700;font-size:14px}.subtitle{margin-top:7px;font-size:17px;font-weight:700}
main{max-width:720px;margin:auto;padding:18px 24px 50px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.row1{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-size:15px;font-weight:700;color:var(--muted);margin:0 0 8px}
input,select{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 18px;font:700 16px Arial;color:var(--text)}
button{height:52px;border:0;border-radius:14px;padding:0 18px;font:700 16px Arial;cursor:pointer}
.secondary{background:var(--light);color:#08665e;width:100%}.primary{background:var(--teal);color:#fff;width:100%}
.new-entry{margin-top:14px}.card{background:#fff;border-radius:24px;padding:28px;margin-top:18px;box-shadow:0 4px 18px #0000000b}
.field{margin-top:18px}.field:first-child{margin-top:0}
.auto{background:#eef4f3}.profit{font-weight:800}
.hidden{display:none}
.history-card{background:#fff;border-radius:20px;padding:18px;margin-top:12px}
.history-head{display:flex;justify-content:space-between;gap:10px;font-weight:800}.meta{color:var(--muted);font-size:14px;margin-top:5px}
.item-list{margin-top:12px}.item-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.danger{background:#fbeaea;color:#a33;width:auto;height:40px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:20px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal-box{background:#fff;width:min(520px,100%);border-radius:22px;padding:24px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px;width:100%}
.stat{background:var(--light);border-radius:16px;padding:12px 8px;text-align:center;min-width:0;overflow:hidden}.stat b{display:block;font-size:16px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){main{padding:14px 24px 40px}.row1,.row2{gap:10px}h1{font-size:29px}.subtitle{font-size:19px}input,select{font-size:17px}.card{padding:26px 28px}}

.dua-card{background:#fff;border-radius:22px;padding:22px 24px;margin-top:18px;text-align:center;box-shadow:0 4px 18px #0000000b}
.dua-title{font-size:16px;font-weight:800;color:#0f766e;margin-bottom:10px}
.dua-text{font-size:15px;line-height:1.55;font-weight:700;overflow-wrap:anywhere;color:#34403f}
.edit-btn{background:#e9f3f2;color:#08665e;width:auto;height:40px;font-size:14px}
.history-actions{display:flex;gap:8px;margin-top:10px}
.time-line{font-size:14px;color:#708080;margin-top:4px}

@media(max-width:520px){
  .summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:13px 10px}
  .stat b{font-size:16px}
  .dua-card{padding:20px 18px}
  .dua-text{font-size:15px;line-height:1.55}
}
</style>
</head>
<body>
<header>
  <h1>Sale Profit Book</h1>
  <div class="version">Version 4.4</div>
  <div class="subtitle">Sale • Purchase • Profit</div>
</header>

<main>
  <!-- ROW 1 -->
  <div class="row1">
    <div>
      <label>State / Place</label>
      <input id="place" value="Kerala" autocomplete="off">
    </div>
    <div>
      <label>Date</label>
      <input id="date" type="date">
    </div>
  </div>

  <!-- ROW 2 -->
  <div class="row2">
    <button class="secondary" onclick="openItemModal()">Add Item</button>
    <button class="secondary" onclick="showHistory()">History</button>
  </div>

  <!-- ROW 3 -->
  <button class="primary new-entry" onclick="newEntry()">New Entry</button>

  <section id="entryCard" class="card">
    <div class="field">
      <label>Item Name</label>
      <select id="item" onchange="calculate()">
        <option value="">Select Item</option>
      </select>
    </div>

    <div class="field">
      <label>Meter</label>
      <input id="meter" type="number" min="0" step="0.01" inputmode="decimal" placeholder="3" oninput="calculate()">
    </div>

    <div class="field">
      <label>Sale ₹</label>
      <input id="sale" type="number" min="0" step="0.01" inputmode="decimal" placeholder="1500" oninput="calculate()">
    </div>

    <div class="field">
      <label>Purchase ₹ (Auto)</label>
      <input id="purchase" class="auto" type="text" readonly placeholder="Auto">
    </div>

    <div class="field">
      <label>Profit ₹ (Auto)</label>
      <input id="profit" class="auto profit" type="text" readonly placeholder="Auto">
    </div>

    <div class="field">
      <button id="saveBtn" class="primary" onclick="saveEntry()">Save Entry</button>
    </div>
  </section>

  <section id="historyCard" class="hidden">
    <div class="summary">
      <div class="stat">Meter<b id="sumMeter">0</b></div>
      <div class="stat">Sale<b id="sumSale">₹0</b></div>
      <div class="stat">Purchase<b id="sumPurchase">₹0</b></div>
      <div class="stat">Profit<b id="sumProfit">₹0</b></div>
    </div>
<div class="dua-card">
      <div class="dua-title">Dua</div>
      <div class="dua-text">யா அல்லாஹ்! எங்கள் வாழ்வில் பரக்கத்தையும், ஹலாலான ரிஸ்க்கையும் வழங்குவாயாக.<br>எங்கள் காரியங்களை எளிதாக்கி, நன்மையைத் தந்து, தீமையிலிருந்து எங்களைப் பாதுகாப்பாயாக.</div>
    </div>
    <div id="historyList"></div>
  </section>
</main>

<div id="itemModal" class="modal">
  <div class="modal-box">
    <h2 style="margin-top:0">Add Item</h2>
    <div class="field">
      <label>Item Name</label>
      <input id="newItemName" placeholder="BSL EXECUTIVE CHOICE">
    </div>
    <div class="field">
      <label>Purchase / Meter ₹</label>
      <input id="newItemRate" type="number" min="0" step="0.01" inputmode="decimal" placeholder="225">
    </div>
    <div class="modal-actions">
      <button class="primary" onclick="saveItem()">Save Item</button>
      <button class="secondary" onclick="closeItemModal()">Close</button>
    </div>
    <div id="itemList" class="item-list"></div>
  </div>
</div>

<script>
const ITEMS_KEY='spb_v4_items';
const ENTRIES_KEY='spb_v4_entries';
let items=JSON.parse(localStorage.getItem(ITEMS_KEY)||'[]');
let entries=JSON.parse(localStorage.getItem(ENTRIES_KEY)||'[]');

const $=id=>document.getElementById(id);
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.toISOString().slice(0,10)};

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function init(){
  $('date').value=today();
  populateItems();
  renderItems();
  renderHistory();
}
function populateItems(){
  const old=$('item').value;
  $('item').innerHTML='<option value="">Select Item</option>'+
    items.map(x=>`<option value="${esc(x.name)}">${esc(x.name)} — ${money(x.rate)}/m</option>`).join('');
  if(items.some(x=>x.name===old)) $('item').value=old;
}
function getRate(){
  const x=items.find(i=>i.name===$('item').value);
  return x?Number(x.rate):0;
}
function calculate(){
  const rate=getRate(), meter=Number($('meter').value)||0, sale=Number($('sale').value)||0;
  const purchase=rate>0&&meter>0?Math.round(rate*meter*100)/100:0;
  const profit=purchase>0?Math.round((sale-purchase)*100)/100:0;
  $('purchase').value=purchase?purchase:'';
  $('profit').value=(sale>0&&purchase>0)?profit:'';
}
function localTime(){const d=new Date();return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});}
let editingId=null;
function saveEntry(){
  const item=$('item').value, meter=Number($('meter').value)||0, sale=Number($('sale').value)||0;
  const rate=getRate(), purchase=rate*meter;
  if(!item){alert('Please select an Item Name.');return}
  if(!(meter>0)){alert('Please enter Meter.');return}
  if(!(sale>=0)){alert('Please enter Sale amount.');return}
  if(!(rate>0)){alert('Please add a Purchase / Meter rate for this item.');return}
  const wasEditing=!!editingId;
  if(editingId){
    const idx=entries.findIndex(x=>x.id===editingId);
    if(idx>=0) entries[idx]={...entries[idx],date:$('date').value||today(),place:$('place').value.trim()||'Kerala',item,meter,rate,sale,purchase,profit:sale-purchase};
  }else{
    entries.unshift({id:Date.now(),date:$('date').value||today(),place:$('place').value.trim()||'Kerala',item,meter,rate,sale,purchase,profit:sale-purchase,time:localTime()});
  }
  editingId=null;$('saveBtn').textContent='Save Entry';
  localStorage.setItem(ENTRIES_KEY,JSON.stringify(entries));
  alert(wasEditing?'Entry updated successfully.':'Entry saved successfully.');
  newEntry();
  renderHistory();
}
function newEntry(){
  editingId=null;$('saveBtn').textContent='Save Entry';
  $('historyCard').classList.add('hidden');$('entryCard').classList.remove('hidden');
  $('item').value='';$('meter').value='';$('sale').value='';$('purchase').value='';$('profit').value='';
  if(!$('date').value)$('date').value=today();
}
function showHistory(){
  $('entryCard').classList.add('hidden');$('historyCard').classList.remove('hidden');renderHistory();
}
function renderHistory(){
  const list=$('historyList');
  const total=entries.reduce((a,x)=>({meter:a.meter+Number(x.meter||0),sale:a.sale+x.sale,purchase:a.purchase+x.purchase,profit:a.profit+x.profit}),{meter:0,sale:0,purchase:0,profit:0});
  $('sumMeter').textContent=Number(total.meter.toFixed(2)).toLocaleString('en-IN');
  $('sumSale').textContent=money(total.sale);$('sumPurchase').textContent=money(total.purchase);$('sumProfit').textContent=money(total.profit);
  if(!entries.length){list.innerHTML='<div class="history-card empty">No records found</div>';return}
  list.innerHTML=entries.map(x=>`
    <div class="history-card">
      <div class="history-head"><span>${esc(x.item)}</span><span>${money(x.profit)}</span></div>
      <div class="meta">${esc(x.date)} • ${esc(x.place)} • ${x.meter} m</div>
      <div class="time-line">Time: ${esc(x.time||'—')}</div>
      <div style="margin-top:9px">Sale ${money(x.sale)} − Purchase ${money(x.purchase)}</div>
      <div class="meta">Purchase / Meter: ${money(x.rate)}</div>
      <div class="history-actions">
        <button class="edit-btn" onclick="editEntry(${x.id})">Edit</button>
        <button class="danger" onclick="deleteEntry(${x.id})">Delete</button>
      </div>
    </div>`).join('');
}
function editEntry(id){
  const x=entries.find(e=>e.id===id);if(!x)return;
  editingId=id;$('entryCard').classList.remove('hidden');$('historyCard').classList.add('hidden');
  $('place').value=x.place||'Kerala';$('date').value=x.date||today();
  $('item').value=x.item;$('meter').value=x.meter;$('sale').value=x.sale;
  calculate();$('saveBtn').textContent='Update Entry';window.scrollTo({top:0,behavior:'smooth'});
}
function deleteEntry(id){
  if(!confirm('Delete this entry?'))return;
  entries=entries.filter(x=>x.id!==id);localStorage.setItem(ENTRIES_KEY,JSON.stringify(entries));renderHistory();
}
function openItemModal(){$('itemModal').style.display='flex';renderItems()}
function closeItemModal(){$('itemModal').style.display='none'}
function saveItem(){
  const name=$('newItemName').value.trim(),rate=Number($('newItemRate').value);
  if(!name||!(rate>0)){alert('Enter Item Name and Purchase / Meter.');return}
  const old=items.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(old)old.rate=rate;else items.push({name,rate});
  localStorage.setItem(ITEMS_KEY,JSON.stringify(items));
  $('newItemName').value='';$('newItemRate').value='';populateItems();renderItems();calculate();
}
function renderItems(){
  const list=$('itemList');
  if(!items.length){list.innerHTML='<div class="empty">No items added</div>';return}
  list.innerHTML=items.map(x=>`
    <div class="item-row">
      <div><b>${esc(x.name)}</b><div class="meta">${money(x.rate)} / meter</div></div>
      <button class="danger" onclick="deleteItem(${JSON.stringify(x.name)})">Delete</button>
    </div>`).join('');
}
function deleteItem(name){
  if(!confirm('Delete this item?'))return;
  items=items.filter(x=>x.name!==name);localStorage.setItem(ITEMS_KEY,JSON.stringify(items));populateItems();renderItems();calculate();
}
init();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v=4.4').catch(()=>{});}
</script>
</body>
</html>
